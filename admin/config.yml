# Painel de edição do cardápio (Decap CMS).
#
# Hospedado 100% na Cloudflare (Pages) + login via GitHub. Passo a passo
# completo em oauth-worker/README.md. Resumo:
# 1. Publique o site no Cloudflare Pages (branch abaixo).
# 2. Publique o Worker em oauth-worker/ (faz a troca do login por token).
# 3. Troque "base_url" abaixo pela URL que o Worker recebeu ao publicar.
# 4. Dê acesso de colaborador no GitHub pra quem for editar o cardápio.
#
# "branch" precisa ser exatamente o branch publicado no Cloudflare Pages.
# Hoje é "claude/menu-website-store-8bch7k" porque ainda não existe um
# branch "main" no repositório — se um dia criarem um e migrarem o site
# pra ele, troque o valor abaixo também.

backend:
  name: github
  repo: marcato-app/brisaloungebar
  branch: claude/menu-website-store-8bch7k
  base_url: https://brisa-cms-oauth.gaabmgomes.workers.dev
  auth_endpoint: auth

publish_mode: simple
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "menu"
    label: "Cardápio"
    files:
      - name: "menu"
        label: "Cardápio completo"
        file: "assets/data/menu.json"
        fields:
          - label: "Seções do cardápio"
            name: "sections"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Identificador (não altere)", name: "id", widget: "string" }
              - { label: "Título da seção", name: "title", widget: "string" }
              - label: "Grupos de itens"
                name: "groups"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "Título do grupo", name: "title", widget: "string" }
                  - { label: "Unidade (ex: 500ml)", name: "unit", widget: "string", required: false }
                  - { label: "Observação do grupo", name: "note", widget: "text", required: false }
                  - { label: "Palavras-chave de busca", name: "keywords", widget: "string", required: false, hint: "Não aparece no site. Preencha se os itens do grupo são só marcas (ex: grupo \"Long Neck\" → cerveja, beer) pra aparecerem numa busca pela categoria." }
                  - label: "Itens"
                    name: "items"
                    widget: "list"
                    summary: "{{name}} — {{price}}"
                    fields:
                      - { label: "Nome do item", name: "name", widget: "string" }
                      - { label: "Unidade (ex: 700ml)", name: "unit", widget: "string", required: false }
                      - { label: "Preço", name: "price", widget: "string", hint: "Formato: R$00,00" }
                      - { label: "Observação do item", name: "note", widget: "text", required: false }
                      - { label: "Palavras-chave de busca", name: "tags", widget: "string", required: false, hint: "Não aparece no site. Ex: item \"Red Label\" → whisky, whiskey, pra aparecer numa busca por \"whisky\"." }
