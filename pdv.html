<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV · Brisa Lounge Bar</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Jost';
    src: url('assets/fonts/jost.woff2') format('woff2');
    font-weight: 300 700;
    font-display: swap;
  }
  /* Ferramenta de operação, não vitrine: sem a serif da marca, paleta mais
     fria e mais dura, números em monoespaçada — cara de painel, não de site. */
  :root {
    --display: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --gold: #ffb400;
    --gold-light: #ffcc33;
    --black: #0a0c0f;
    --black-soft: #14171c;
    --card: #181c22;
    --border: #2b313a;
    --text: #eef1f5;
    --text-dim: #8b93a1;
    --danger: #ff5252;
    --ok: #22c55e;
    --novo: #3b82f6;
    --producao: #ffb400;
    --aguardando: #a855f7;
    --entregue: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    background: var(--black);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  input, select, button { font-family: inherit; }
  .hidden { display: none !important; }
  a{ color: inherit; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  /* login — mesmo padrão do painel de cardápio */
  #view-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 24px;
    max-width: 340px;
    width: 100%;
  }
  .login-box h1 {
    font-family: var(--display);
    font-weight: 700;
    color: var(--text);
    font-size: 1.15rem;
    letter-spacing: 1px;
    margin: 0 0 4px;
    text-align: center;
  }
  .login-box h1 .tag {
    display: inline-block; font-family: var(--mono); color: var(--gold);
    font-weight: 600; font-size: 0.62rem; letter-spacing: 1px;
    margin-left: 8px; padding: 2px 6px; border: 1px solid var(--gold); border-radius: 4px;
    vertical-align: middle; text-transform: uppercase;
  }
  .login-box p.sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    margin: 0 0 24px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 11px 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--black-soft);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--gold); }
  .btn {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--gold);
    color: var(--black);
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn-secondary {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: auto;
  }
  .btn-small { width: auto; padding: 8px 14px; font-size: 0.72rem; border-radius: 6px; }
  .error-box {
    background: color-mix(in srgb, var(--danger) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
    color: var(--danger);
    font-size: 0.8rem;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  /* dashboard */
  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--black-soft);
    border-bottom: 2px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header.top .brand { font-family: var(--display); color: var(--text); font-weight: 700; letter-spacing: 0.5px; font-size: 1rem; text-transform: uppercase; }
  header.top .brand small { display: inline-block; font-family: var(--mono); color: var(--gold); font-weight: 600; font-size: 0.62rem; letter-spacing: 1px; margin-left: 8px; padding: 2px 6px; border: 1px solid var(--gold); border-radius: 4px; vertical-align: middle; }
  header.top .who { display: flex; align-items: center; gap: 12px; }
  header.top .who span { font-size: 0.76rem; color: var(--text-dim); text-align: right; }
  header.top .who span b { color: var(--text); display: block; font-weight: 500; }

  nav.tabs {
    position: sticky;
    top: 61px;
    z-index: 19;
    display: flex;
    gap: 0;
    padding: 0 16px;
    background: var(--black-soft);
    border-bottom: 2px solid var(--border);
    overflow-x: auto;
  }
  nav.tabs button {
    flex: 0 0 auto;
    padding: 12px 16px;
    border: none;
    border-bottom: 3px solid transparent;
    background: none;
    color: var(--text-dim);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    cursor: pointer;
  }
  nav.tabs button.active { color: var(--gold-light); border-bottom-color: var(--gold); }

  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--gold);
    color: var(--black);
    padding: 12px 22px;
    border-radius: 24px;
    font-weight: 700;
    font-size: 0.82rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); color: #fff; }

  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .panel-head h2 { color: var(--gold); font-size: 1.1rem; margin: 0; font-family: var(--display); font-weight: 600; letter-spacing: 0.5px; }

  .search-row { margin-bottom: 16px; }
  .search-row input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--black-soft);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }
  .search-row input:focus { border-color: var(--gold); }

  .row-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .row-card .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row-card .name { font-weight: 500; font-size: 0.98rem; }
  .row-card .meta { color: var(--text-dim); font-size: 0.8rem; margin-top: 3px; }
  .row-card .badge {
    font-size: 0.65rem; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 3px 9px; border-radius: 4px; font-weight: 600; white-space: nowrap;
  }
  .badge.role-gerente { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold-light); }
  .badge.role-caixa { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.role-garcom { background: color-mix(in srgb, var(--text-dim) 18%, transparent); color: var(--text-dim); }
  .badge.inactive { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }

  .row-card .actions { display: flex; gap: 8px; margin-top: 10px; }
  .row-card .actions button {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: none; color: var(--text-dim); font-size: 0.72rem; cursor: pointer;
  }
  .row-card .actions button:hover { border-color: var(--gold); color: var(--gold); }

  .edit-form { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); display: none; }
  .edit-form.open { display: block; }
  .edit-form .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .edit-form input, .edit-form select {
    background: var(--black-soft); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 0.85rem; outline: none;
  }
  .edit-form input:focus, .edit-form select:focus { border-color: var(--gold); }
  .edit-form .name-input { flex: 1 1 160px; }
  .edit-form .small-input { flex: 1 1 110px; }
  .edit-form label.check { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-dim); flex: 0 0 auto; }
  .edit-form .save-row { display: flex; gap: 8px; }
  .edit-form .save-row button {
    padding: 8px 14px; border-radius: 6px; border: none; font-size: 0.76rem; cursor: pointer;
  }
  .edit-form .save-row .save { background: var(--gold); color: var(--black); font-weight: 600; }
  .edit-form .save-row .cancel { background: none; border: 1px solid var(--border); color: var(--text-dim); }

  .add-block { margin-top: 18px; }
  .add-block > button {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px dashed var(--border);
    background: none; color: var(--text-dim); font-size: 0.82rem; cursor: pointer;
  }
  .add-block > button:hover { border-color: var(--gold); color: var(--gold); }
  .add-form-box {
    display: none; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-top: 10px;
  }
  .add-form-box.open { display: block; }
  .add-form-box .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .add-form-box input, .add-form-box select {
    background: var(--black-soft); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 9px 11px; font-size: 0.87rem; outline: none;
  }
  .add-form-box input:focus, .add-form-box select:focus { border-color: var(--gold); }
  .add-form-box .name-input { flex: 1 1 100%; }
  .add-form-box .half { flex: 1 1 140px; }

  .empty-msg { color: var(--text-dim); text-align: center; padding: 40px 0; font-size: 0.88rem; }

  @media (max-width: 480px) {
    header.top { flex-wrap: wrap; }
    header.top .who span { text-align: left; }
  }

  /* --------------------------------------------------------- comandas --- */
  .back-link {
    background: none; border: none; color: var(--gold); font-size: 0.82rem;
    cursor: pointer; padding: 0 0 14px; display: flex; align-items: center; gap: 4px;
  }
  .tab-total {
    display: flex; align-items: baseline; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 16px;
  }
  .tab-total .label { color: var(--text-dim); font-size: 0.82rem; }
  .tab-total .value { color: var(--gold-light); font-weight: 700; font-size: 1.3rem; font-variant-numeric: tabular-nums; }

  .status-pill {
    font-size: 0.62rem; letter-spacing: 0.4px; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px; font-weight: 600; white-space: nowrap;
  }
  .status-pendente { background: color-mix(in srgb, var(--novo) 18%, transparent); color: var(--novo); }
  .status-preparando { background: color-mix(in srgb, var(--producao) 20%, transparent); color: var(--gold-light); }
  .status-entregue { background: color-mix(in srgb, var(--entregue) 18%, transparent); color: var(--entregue); }
  .status-pronto { background: color-mix(in srgb, var(--aguardando) 20%, transparent); color: var(--aguardando); }
  .status-cancelado { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); text-decoration: line-through; }

  .item-line {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px dashed var(--border);
  }
  .item-line:last-child { border-bottom: none; }
  .item-line .info { flex: 1 1 auto; min-width: 0; }
  .item-line .info .nm { font-size: 0.92rem; }
  .item-line .info .meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .item-line .price { font-size: 0.9rem; color: var(--gold-light); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item-line .cancel-x {
    background: none; border: none; color: var(--text-dim); font-size: 0.9rem;
    cursor: pointer; padding: 2px 4px; line-height: 1;
  }
  .item-line .cancel-x:hover { color: var(--danger); }

  .picker-box { margin-top: 18px; }
  .picker-box input {
    width: 100%; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--black-soft); color: var(--text); font-size: 0.9rem; outline: none;
  }
  .picker-box input:focus { border-color: var(--gold); }
  .picker-results { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .picker-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; cursor: pointer; text-align: left; width: 100%;
  }
  .picker-row:hover { border-color: var(--gold); }
  .picker-row .nm { font-size: 0.88rem; }
  .picker-row .pr { font-size: 0.86rem; color: var(--gold-light); font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------ kanban --- */
  /* Um quadro de verdade: quatro colunas com dono e cor próprios, do jeito
     que se vê numa tela de cozinha — não uma lista de site rolando pra baixo. */
  .kanban {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity;
    margin: 0 -16px; padding: 4px 16px 12px;
  }
  .kanban-col { flex: 0 0 250px; scroll-snap-align: start; display: flex; flex-direction: column; }
  .kanban-col-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-radius: 6px 6px 0 0;
    font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--black); background: var(--col-color);
  }
  .kanban-col-head .count {
    font-family: var(--mono); background: rgba(0,0,0,0.22);
    padding: 1px 7px; border-radius: 4px; font-size: 0.72rem;
  }
  .kanban-col-body {
    flex: 1 1 auto; min-height: 100px; background: var(--black-soft);
    border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px;
    padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .kanban-card {
    background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--col-color);
    border-radius: 6px; padding: 10px 12px;
  }
  .kanban-card .nm { font-weight: 600; font-size: 0.9rem; }
  .kanban-card .meta { color: var(--text-dim); font-size: 0.72rem; margin-top: 4px; }
  .kanban-card .note { color: var(--gold-light); font-size: 0.76rem; margin-top: 4px; font-style: italic; }
  .kanban-card button {
    width: 100%; margin-top: 9px; padding: 8px; border-radius: 6px; border: none;
    background: var(--col-color); color: var(--black); font-weight: 700; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.3px; cursor: pointer;
  }
  .kanban-card button:disabled { opacity: 0.5; }
  .kanban-empty { color: var(--text-dim); font-size: 0.78rem; text-align: center; padding: 14px 0; margin: 0; }

  /* ------------------------------------------------------------ cupom --- */
  .receipt {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 22px 20px; max-width: 360px; margin: 0 auto;
  }
  .receipt-head { text-align: center; margin-bottom: 16px; }
  .receipt-head img { width: 44px; margin: 0 auto 8px; }
  .receipt-brand { font-family: var(--display); color: var(--gold); font-weight: 600; letter-spacing: 2px; font-size: 0.95rem; }
  .receipt-sub { color: var(--text-dim); font-size: 0.82rem; margin-top: 4px; }
  .receipt-lines { padding: 10px 0; border-top: 1px dashed var(--border); }
  .receipt-row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.86rem; padding: 4px 0; }
  .receipt-row.strong { font-weight: 700; color: var(--gold-light); font-size: 0.98rem; }
  .receipt-totals { padding: 6px 0; border-top: 1px dashed var(--border); }
  .receipt-foot { text-align: center; color: var(--text-dim); font-size: 0.7rem; margin-top: 14px; letter-spacing: 0.5px; }

  /* -------------------------------------------------------------- modal --- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.65);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px 22px; max-width: 340px; width: 100%;
  }
  .modal-box h3 {
    margin: 0 0 6px; color: var(--gold); font-family: var(--display);
    font-weight: 600; font-size: 1.05rem;
  }
  .modal-msg { color: var(--text-dim); font-size: 0.86rem; margin: 0 0 16px; line-height: 1.4; }
  .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
  .modal-actions button { flex: 1 1 auto; }

  @media print {
    header.top, nav.tabs, #toast, .no-print { display: none !important; }
    body, main { background: #fff !important; }
    main { padding: 0 !important; max-width: none !important; }
    .receipt {
      background: #fff !important; border: none !important; color: #000 !important;
      max-width: none !important; padding: 0 !important;
    }
    .receipt-brand, .receipt-row.strong { color: #000 !important; }
    .receipt-sub, .receipt-foot { color: #444 !important; }
  }
</style>
</head>
<body>

<div id="view-login">
  <div class="login-box">
    <h1>BRISA <span class="tag">PDV</span></h1>
    <p class="sub">Login de funcionário</p>
    <div id="loginError" class="error-box hidden"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Usuário</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>
</div>

<div id="view-dashboard" class="hidden">
  <header class="top">
    <div class="brand">BRISA <small>PDV</small></div>
    <div class="who">
      <span id="whoami"></span>
      <button id="logoutBtn" class="btn btn-secondary btn-small">Sair</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="comandas" id="tabComandas">Comandas</button>
    <button data-tab="bar_cozinha" id="tabBarCozinha">Bar/Cozinha</button>
    <button data-tab="tabacaria" id="tabTabacaria">Tabacaria</button>
    <button data-tab="funcionarios" id="tabFuncionarios">Funcionários</button>
    <button data-tab="clientes" id="tabClientes">Clientes</button>
  </nav>
  <main id="content"></main>
</div>

<div id="toast"></div>

<div id="managerAuthOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>Autorização de gerência</h3>
    <p class="modal-msg" id="managerAuthMsg"></p>
    <div class="field">
      <label for="managerAuthUser">Usuário do gerente</label>
      <input type="text" id="managerAuthUser" autocomplete="off">
    </div>
    <div class="field">
      <label for="managerAuthPass">Senha</label>
      <input type="password" id="managerAuthPass" autocomplete="off">
    </div>
    <div id="managerAuthError" class="error-box hidden"></div>
    <div class="modal-actions">
      <button id="managerAuthCancel" class="btn btn-secondary" type="button">Cancelar</button>
      <button id="managerAuthConfirm" class="btn" type="button">Confirmar</button>
    </div>
  </div>
</div>

<script>
(function () {
  var viewLogin = document.getElementById('view-login');
  var viewDashboard = document.getElementById('view-dashboard');
  var loginForm = document.getElementById('loginForm');
  var loginError = document.getElementById('loginError');
  var logoutBtn = document.getElementById('logoutBtn');
  var content = document.getElementById('content');
  var toast = document.getElementById('toast');
  var whoami = document.getElementById('whoami');
  var mgrOverlay = document.getElementById('managerAuthOverlay');
  var mgrMsg = document.getElementById('managerAuthMsg');
  var mgrUser = document.getElementById('managerAuthUser');
  var mgrPass = document.getElementById('managerAuthPass');
  var mgrError = document.getElementById('managerAuthError');
  var mgrCancelBtn = document.getElementById('managerAuthCancel');
  var mgrConfirmBtn = document.getElementById('managerAuthConfirm');
  var tabFuncionarios = document.getElementById('tabFuncionarios');
  var tabClientes = document.getElementById('tabClientes');
  var tabComandas = document.getElementById('tabComandas');
  var tabBarCozinha = document.getElementById('tabBarCozinha');
  var tabTabacaria = document.getElementById('tabTabacaria');
  var ALL_TABS = [tabComandas, tabBarCozinha, tabTabacaria, tabFuncionarios, tabClientes];

  var ROLE_LABEL = { gerente: 'Gerente', caixa: 'Caixa', garcom: 'Garçom' };
  var me = null;
  var activeTab = 'comandas';
  var sectorPoll = null;   // intervalo de atualização das telas de setor
  var catalogCache = null; // /api/pdv/catalog, buscado uma vez e reaproveitado

  function showToast(msg, isError) {
    toast.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    opts.credentials = 'same-origin';
    return fetch(path, opts).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || 'Erro');
        return data;
      });
    });
  }

  function el(tag, className, html) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Pede usuário + senha de um gerente antes de fazer algo sensível (hoje só
  // cancelar item). `action(username, password)` deve devolver uma Promise —
  // se ela rejeitar, o erro aparece dentro do modal e a pessoa pode tentar de
  // novo sem refazer o fluxo inteiro; se resolver, o modal fecha sozinho.
  function openManagerAuth(message, action) {
    mgrMsg.textContent = message;
    mgrUser.value = '';
    mgrPass.value = '';
    mgrError.classList.add('hidden');
    mgrConfirmBtn.disabled = false;
    mgrOverlay.classList.remove('hidden');
    mgrUser.focus();

    mgrConfirmBtn.onclick = function () {
      var username = mgrUser.value.trim();
      var password = mgrPass.value;
      if (!username || !password) {
        mgrError.textContent = 'Preencha usuário e senha';
        mgrError.classList.remove('hidden');
        return;
      }
      mgrError.classList.add('hidden');
      mgrConfirmBtn.disabled = true;
      action(username, password).then(function () {
        mgrOverlay.classList.add('hidden');
      }).catch(function (err) {
        mgrError.textContent = err.message;
        mgrError.classList.remove('hidden');
      }).finally(function () {
        mgrConfirmBtn.disabled = false;
      });
    };
    mgrCancelBtn.onclick = function () { mgrOverlay.classList.add('hidden'); };
  }

  function checkSession() {
    api('/api/pdv/me').then(function (data) {
      me = data;
      showDashboard();
    }).catch(function () {
      showLogin();
    });
  }

  function showLogin() {
    viewLogin.classList.remove('hidden');
    viewDashboard.classList.add('hidden');
  }

  function showDashboard() {
    viewLogin.classList.add('hidden');
    viewDashboard.classList.remove('hidden');
    whoami.innerHTML = '<b>' + esc(me.name) + '</b>' + ROLE_LABEL[me.role];

    // Cadastro de funcionários é coisa de gerente — quem não é, nem vê a aba.
    tabFuncionarios.classList.toggle('hidden', me.role !== 'gerente');
    renderTabs();
    loadTab();
  }

  function renderTabs() {
    ALL_TABS.forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.tab === activeTab);
    });
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-tab]');
    if (!btn || btn.classList.contains('hidden')) return;
    activeTab = btn.dataset.tab;
    renderTabs();
    loadTab();
  });

  function loadTab() {
    clearInterval(sectorPoll);
    sectorPoll = null;
    if (activeTab === 'funcionarios') loadFuncionarios();
    else if (activeTab === 'clientes') loadClientes();
    else if (activeTab === 'bar_cozinha') loadSector('bar_cozinha', 'Bar/Cozinha');
    else if (activeTab === 'tabacaria') loadSector('tabacaria', 'Tabacaria');
    else loadComandas();
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginError.classList.add('hidden');
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    api('/api/pdv/login', { method: 'POST', body: JSON.stringify({ username: username, password: password }) })
      .then(function () { return api('/api/pdv/me'); })
      .then(function (data) { me = data; showDashboard(); })
      .catch(function (err) {
        loginError.textContent = err.message;
        loginError.classList.remove('hidden');
      });
  });

  logoutBtn.addEventListener('click', function () {
    api('/api/pdv/logout', { method: 'POST' }).finally(showLogin);
  });

  /* ============================== FUNCIONÁRIOS ============================== */

  function loadFuncionarios() {
    content.innerHTML = '';
    var head = el('div', 'panel-head');
    head.appendChild(el('h2', '', 'Funcionários'));
    content.appendChild(head);

    var list = el('div');
    content.appendChild(list);
    list.innerHTML = '<p class="empty-msg">Carregando…</p>';

    api('/api/pdv/employees').then(function (data) {
      list.innerHTML = '';
      if (!data.employees.length) {
        list.appendChild(el('p', 'empty-msg', 'Nenhum funcionário cadastrado ainda.'));
      }
      data.employees.forEach(function (emp) { list.appendChild(employeeCard(emp)); });

    }).catch(function (err) {
      list.innerHTML = '';
      list.appendChild(el('p', 'empty-msg', 'Erro ao carregar: ' + esc(err.message)));
    });

    var head = el('div', 'head');

    nameBlock.appendChild(el('div', 'name', esc(emp.name)));
    nameBlock.appendChild(el('div', 'meta', '@' + esc(emp.username)));

    var badges = el('div');
    badges.style.display = 'flex';
    badges.style.gap = '6px';
    badges.appendChild(el('span', 'badge role-' + emp.role, ROLE_LABEL[emp.role]));

    card.appendChild(head);

    var actions = el('div', 'actions');
    var editBtn = el('button', '', 'Editar');
    actions.appendChild(editBtn);
    card.appendChild(actions);

    var form = el('div', 'edit-form');
    var grid = el('div', 'grid');

    activeLabel.appendChild(activeCheck);

    grid.appendChild(roleSelect);
    grid.appendChild(pwInput);
    grid.appendChild(activeLabel);

    var cancelBtn = el('button', 'cancel', 'Cancelar');
    saveRow.appendChild(saveBtn);
    saveRow.appendChild(cancelBtn);
    form.appendChild(saveRow);
    card.appendChild(form);

    editBtn.addEventListener('click', function () { form.classList.toggle('open'); });
    cancelBtn.addEventListener('click', function () { form.classList.remove('open'); });

    saveBtn.addEventListener('click', function () {
      var name = nameInput.value.trim();
      if (!name) { showToast('Informe o nome', true); return; }
      var payload = { name: name, role: roleSelect.value, active: activeCheck.checked };
      if (pwInput.value) payload.password = pwInput.value;
      saveBtn.disabled = true;
      api('/api/pdv/employees/' + emp.id, { method: 'PUT', body: JSON.stringify(payload) })
        .then(function () {
          showToast('Salvo');
          loadFuncionarios();
        })
        .catch(function (err) { showToast(err.message, true); })
        .finally(function () { saveBtn.disabled = false; });

    return card;

  function roleSelectEl(current) {
    var sel = el('select'); sel.className = 'small-input';
    [['garcom', 'Garçom'], ['caixa', 'Caixa'], ['gerente', 'Gerente']].forEach(function (r) {
      var opt = el('option', '', r[1]); opt.value = r[0];
      if (r[0] === current) opt.selected = true;
      sel.appendChild(opt);
    });
    return sel;
  }

    var wrap = el('div', 'add-block');
    var toggleBtn = el('button', '', '+ Cadastrar funcionário');
    var box = el('div', 'add-form-box');
    var grid = el('div', 'grid');

    var userInput = el('input'); userInput.className = 'half'; userInput.placeholder = 'Usuário de login';

      var name = nameInput.value.trim();

  /* ================================ CLIENTES ================================ */

  var custSearchTimer = null;

  function loadClientes() {
    content.innerHTML = '';
    var head = el('div', 'panel-head');
    head.appendChild(el('h2', '', 'Clientes'));
    content.appendChild(head);

    var searchRow = el('div', 'search-row');
    var searchInput = el('input');
    searchInput.type = 'search';
    searchInput.placeholder = 'Buscar por nome ou telefone…';
    searchRow.appendChild(searchInput);
    content.appendChild(searchRow);

    var list = el('div');
    content.appendChild(list);

    var addBlock = addCustomerBlock(function () { fetchCustomers(searchInput.value, list); });
    content.appendChild(addBlock);

    searchInput.addEventListener('input', function () {
      clearTimeout(custSearchTimer);
      custSearchTimer = setTimeout(function () { fetchCustomers(searchInput.value, list); }, 250);
    });

    fetchCustomers('', list);
  }

  function fetchCustomers(q, list) {
    list.innerHTML = '<p class="empty-msg">Carregando…</p>';
    api('/api/pdv/customers?q=' + encodeURIComponent(q || '')).then(function (data) {
      list.innerHTML = '';
      if (!data.customers.length) {
        list.appendChild(el('p', 'empty-msg', q ? 'Nenhum cliente encontrado.' : 'Nenhum cliente cadastrado ainda.'));
        return;
      }
      data.customers.forEach(function (c) { list.appendChild(customerCard(c)); });
    }).catch(function (err) {
      list.innerHTML = '';
      list.appendChild(el('p', 'empty-msg', 'Erro ao carregar: ' + esc(err.message)));
    });
  }

  function formatBirthDate(iso) {
    if (!iso) return '';
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function customerCard(c) {
    var card = el('div', 'row-card');
    var head = el('div', 'head');
    var nameBlock = el('div');
    nameBlock.appendChild(el('div', 'name', esc(c.name)));
    var metaParts = [];
    if (c.phone) metaParts.push(esc(c.phone));
    if (c.birth_date) metaParts.push('nasc. ' + formatBirthDate(c.birth_date));
    nameBlock.appendChild(el('div', 'meta', metaParts.join(' · ') || 'Sem telefone cadastrado'));
    head.appendChild(nameBlock);
    card.appendChild(head);

    var actions = el('div', 'actions');
    var editBtn = el('button', '', 'Editar');
    actions.appendChild(editBtn);
    card.appendChild(actions);

    var form = el('div', 'edit-form');
    var grid = el('div', 'grid');
    var nameInput = el('input'); nameInput.className = 'name-input'; nameInput.value = c.name;
    var phoneInput = el('input'); phoneInput.className = 'small-input'; phoneInput.value = c.phone || '';
    phoneInput.placeholder = 'Telefone';
    var birthInput = el('input'); birthInput.type = 'date'; birthInput.className = 'small-input';
    birthInput.value = c.birth_date || '';
    grid.appendChild(nameInput);
    grid.appendChild(phoneInput);
    grid.appendChild(birthInput);
    form.appendChild(grid);

    var saveRow = el('div', 'save-row');
    var saveBtn = el('button', 'save', 'Salvar');
    var cancelBtn = el('button', 'cancel', 'Cancelar');
    saveRow.appendChild(saveBtn);
    saveRow.appendChild(cancelBtn);
    form.appendChild(saveRow);
    card.appendChild(form);

    editBtn.addEventListener('click', function () { form.classList.toggle('open'); });
    cancelBtn.addEventListener('click', function () { form.classList.remove('open'); });

    saveBtn.addEventListener('click', function () {
      var name = nameInput.value.trim();
      if (!name) { showToast('Informe o nome', true); return; }
      saveBtn.disabled = true;
      api('/api/pdv/customers/' + c.id, {
        method: 'PUT',
        body: JSON.stringify({ name: name, phone: phoneInput.value.trim(), birthDate: birthInput.value || null }),
      }).then(function () {
        showToast('Salvo');
        card.querySelector('.name').textContent = name;
        form.classList.remove('open');
      }).catch(function (err) { showToast(err.message, true); })
        .finally(function () { saveBtn.disabled = false; });
    });

    return card;

  function addCustomerBlock(onAdded) {
    var wrap = el('div', 'add-block');
    var toggleBtn = el('button', '', '+ Cadastrar cliente');

    var grid = el('div', 'grid');
    var nameInput = el('input'); nameInput.className = 'name-input'; nameInput.placeholder = 'Nome do cliente';

    grid.appendChild(phoneInput);
    grid.appendChild(birthInput);
    box.appendChild(grid);

    var confirmBtn = el('button', 'btn', 'Cadastrar');
    box.appendChild(confirmBtn);

    confirmBtn.addEventListener('click', function () {
      var name = nameInput.value.trim();
      if (!name) { showToast('Informe o nome', true); return; }
      confirmBtn.disabled = true;
      api('/api/pdv/customers', {
        method: 'POST',

  /* =============================== CATÁLOGO =============================== */

  function loadCatalog() {
    if (catalogCache) return Promise.resolve(catalogCache);
    return api('/api/pdv/catalog').then(function (data) {
      catalogCache = data.sections.flatMap(function (s) {
        return s.groups.flatMap(function (g) {
          return g.items.map(function (it) {
            return { id: it.id, name: it.name, unit: it.unit, priceCents: it.priceCents,
                     sector: g.sector, groupTitle: g.title, sectionTitle: s.title };
          });
        });
      });
      return catalogCache;
    });
  }

  function formatCents(cents) {
    return 'R$' + (cents / 100).toFixed(2).replace('.', ',');
  }

  /* ============================== COMANDAS ================================= */

  function loadComandas() {
    content.innerHTML = '';
    var head = el('div', 'panel-head');
    head.appendChild(el('h2', '', 'Comandas'));
    content.appendChild(head);

    var list = el('div');
    content.appendChild(list);
    list.innerHTML = '<p class="empty-msg">Carregando…</p>';

    api('/api/pdv/tabs?status=aberta').then(function (data) {
      list.innerHTML = '';
      if (!data.tabs.length) {
        list.appendChild(el('p', 'empty-msg', 'Nenhuma comanda aberta agora.'));
      }
      data.tabs.forEach(function (t) { list.appendChild(tabListCard(t)); });
      content.appendChild(addTabBlock(loadComandas));
    }).catch(function (err) {
      list.innerHTML = '';
      list.appendChild(el('p', 'empty-msg', 'Erro ao carregar: ' + esc(err.message)));
    });
  }

  function tabListCard(t) {
    var card = el('div', 'row-card');
    card.style.cursor = 'pointer';
    var head = el('div', 'head');
    var nameBlock = el('div');
    nameBlock.appendChild(el('div', 'name', esc(t.label)));
    var meta = t.customer_name ? esc(t.customer_name) : 'Sem cliente vinculado';
    nameBlock.appendChild(el('div', 'meta', meta));
    head.appendChild(nameBlock);
    head.appendChild(el('div', 'badge role-caixa', formatCents(t.totalCents)));
    card.appendChild(head);
    card.addEventListener('click', function () { loadTabDetail(t.id); });
    return card;
  }

  function addTabBlock(onAdded) {
    var wrap = el('div', 'add-block');
    var toggleBtn = el('button', '', '+ Abrir comanda');
    var box = el('div', 'add-form-box');
    var grid = el('div', 'grid');
    var labelInput = el('input'); labelInput.className = 'name-input';
    labelInput.placeholder = 'Nome da comanda (Mesa 4, Hércules...)';
    grid.appendChild(labelInput);
    box.appendChild(grid);
    var confirmBtn = el('button', 'btn', 'Abrir');
    box.appendChild(confirmBtn);

    toggleBtn.addEventListener('click', function () { box.classList.toggle('open'); });
    confirmBtn.addEventListener('click', function () {
      var label = labelInput.value.trim();
      if (!label) { showToast('Dê um nome pra comanda', true); return; }

      api('/api/pdv/tabs', { method: 'POST', body: JSON.stringify({ label: label }) })
        .then(function (res) { loadTabDetail(res.id); })
        .catch(function (err) { showToast(err.message, true); })
        .finally(function () { confirmBtn.disabled = false; });

    wrap.appendChild(toggleBtn);
    wrap.appendChild(box);

  function loadTabDetail(tabId) {
    content.innerHTML = '<p class="empty-msg">Carregando…</p>';
    api('/api/pdv/tabs/' + tabId).then(function (tab) {
      renderTabDetail(tab);
    }).catch(function (err) {
      content.innerHTML = '';
      content.appendChild(el('p', 'empty-msg', 'Erro ao carregar: ' + esc(err.message)));
    });
  }

  function renderTabDetail(tab) {
    content.innerHTML = '';

    var back = el('button', 'back-link', '← Comandas');
    back.addEventListener('click', loadComandas);
    content.appendChild(back);

    var head = el('div', 'panel-head');
    head.appendChild(el('h2', '', esc(tab.label)));
    var renameBtn = el('button', 'btn btn-secondary btn-small', 'Transferir');
    head.appendChild(renameBtn);
    content.appendChild(head);

    var renameForm = el('div', 'edit-form');
    var renameGrid = el('div', 'grid');
    var renameInput = el('input'); renameInput.className = 'name-input'; renameInput.value = tab.label;
    renameInput.placeholder = 'Novo nome (quem assume a comanda)';
    renameGrid.appendChild(renameInput);
    renameForm.appendChild(renameGrid);
    var renameSaveRow = el('div', 'save-row');
    var renameSaveBtn = el('button', 'save', 'Salvar');
    var renameCancelBtn = el('button', 'cancel', 'Cancelar');
    renameSaveRow.appendChild(renameSaveBtn);
    renameSaveRow.appendChild(renameCancelBtn);
    renameForm.appendChild(renameSaveRow);
    content.appendChild(renameForm);

    renameBtn.addEventListener('click', function () { renameForm.classList.toggle('open'); });
    renameCancelBtn.addEventListener('click', function () { renameForm.classList.remove('open'); });
    renameSaveBtn.addEventListener('click', function () {
      var label = renameInput.value.trim();
      if (!label) { showToast('Dê um nome pra comanda', true); return; }
      api('/api/pdv/tabs/' + tab.id, { method: 'PUT', body: JSON.stringify({ label: label, customerId: tab.customer_id }) })
        .then(function () { showToast('Comanda transferida'); loadTabDetail(tab.id); })
        .catch(function (err) { showToast(err.message, true); });
    });

    if (tab.status === 'fechada') {
      var closedBanner = el('div', 'tab-total');
      closedBanner.appendChild(el('span', 'label', 'Comanda fechada'));
      closedBanner.appendChild(el('span', 'value', formatCents(tab.totalCents)));
      content.appendChild(closedBanner);
    } else {
      content.appendChild(totalsSummary(tab));
    }

    var linesBox = el('div', 'row-card');
    if (!tab.items.length) {
      linesBox.appendChild(el('p', 'empty-msg', 'Nada lançado ainda.'));
    }
    tab.items.forEach(function (it) { linesBox.appendChild(itemLine(it, tab.id)); });
    content.appendChild(linesBox);

    var receiptBtn = el('button', 'btn btn-secondary', 'Ver cupom');
    receiptBtn.style.marginTop = '14px';
    receiptBtn.addEventListener('click', function () { renderReceipt(tab); });
    content.appendChild(receiptBtn);

    if (tab.status === 'aberta') {
      content.appendChild(itemPicker(tab.id));
      content.appendChild(paymentSection(tab));
    }

    if (tab.payments.length) content.appendChild(paymentsList(tab));
  }

  function totalsSummary(tab) {
    var box = el('div', 'tab-total');
    box.style.flexDirection = 'column';
    box.style.gap = '8px';
    box.style.alignItems = 'stretch';

    function row(label, value, color) {
      var r = el('div');
      r.style.display = 'flex';
      r.style.justifyContent = 'space-between';
      r.style.alignItems = 'baseline';
      var l = el('span', 'label', label);
      var v = el('span', 'value', formatCents(value));
      v.style.fontSize = '1.05rem';
      if (color) v.style.color = color;
      r.appendChild(l);
      r.appendChild(v);
      return r;
    }
    box.appendChild(row('Total', tab.totalCents));
    box.appendChild(row('Pago', tab.paidCents, 'var(--ok)'));
    box.appendChild(row('Pendente', tab.pendingCents, tab.pendingCents > 0 ? 'var(--danger)' : 'var(--ok)'));
    return box;
  }

  function paymentsList(tab) {
    var box = el('div', 'row-card');
    box.appendChild(el('div', 'panel-head', '<h2 style="font-size:0.92rem;margin:0;">Pagamentos</h2>'));
    tab.payments.forEach(function (p) {
      var line = el('div', 'item-line');
      var info = el('div', 'info');
      info.appendChild(el('div', 'nm', PAYMENT_METHOD_LABEL[p.method] || p.method));
      info.appendChild(el('div', 'meta', esc(p.payer_name || 'Sem nome informado')));
      line.appendChild(info);
      line.appendChild(el('span', 'price', formatCents(p.amount_cents)));
      box.appendChild(line);
    });
    return box;
  }

  var PAYMENT_METHOD_LABEL = { dinheiro: 'Dinheiro', pix: 'Pix', debito: 'Débito', credito: 'Crédito', outro: 'Outro' };

  function paymentSection(tab) {
    var wrap = el('div', 'picker-box');
    var unpaid = tab.items.filter(function (it) { return !it.paid && it.status !== 'cancelado'; });

    if (!unpaid.length) {
      wrap.appendChild(el('div', 'panel-head', '<h2 style="font-size:0.98rem;margin:0;">Fechamento</h2>'));
      wrap.appendChild(el('p', 'empty-msg', 'Tudo pago.'));
      var closeBtn = el('button', 'btn', 'Fechar comanda');
      closeBtn.addEventListener('click', function () {
        closeBtn.disabled = true;
        api('/api/pdv/tabs/' + tab.id + '/close', { method: 'POST' })
          .then(function () { showToast('Comanda fechada'); loadTabDetail(tab.id); })
          .catch(function (err) { showToast(err.message, true); closeBtn.disabled = false; });
      });
      wrap.appendChild(closeBtn);
      return wrap;
    }

    wrap.appendChild(el('div', 'panel-head', '<h2 style="font-size:0.98rem;margin:0;">Registrar pagamento</h2>'));
    var checks = [];
    unpaid.forEach(function (it) {
      var row = el('label', 'edit-form open');
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.gap = '10px';
      row.style.cursor = 'pointer';
      var cb = el('input'); cb.type = 'checkbox'; cb.value = it.id;
      checks.push(cb);
      var label = el('span', '', it.qty + '× ' + esc(it.name) + ' — ' + formatCents(it.unit_price_cents * it.qty));
      label.style.flex = '1 1 auto';
      label.style.fontSize = '0.88rem';
      row.appendChild(cb);
      row.appendChild(label);
      wrap.appendChild(row);
    });

    var grid = el('div', 'grid');
    grid.style.marginTop = '12px';
    var methodSelect = el('select'); methodSelect.className = 'half';
    [['dinheiro', 'Dinheiro'], ['pix', 'Pix'], ['debito', 'Débito'], ['credito', 'Crédito'], ['outro', 'Outro']].forEach(function (m) {
      var opt = el('option', '', m[1]); opt.value = m[0]; methodSelect.appendChild(opt);
    });
    var payerInput = el('input'); payerInput.className = 'half'; payerInput.placeholder = 'Nome de quem paga (opcional)';
    grid.appendChild(methodSelect);
    grid.appendChild(payerInput);
    wrap.appendChild(grid);

    var payBtn = el('button', 'btn', 'Registrar pagamento');
    payBtn.style.marginTop = '10px';
    payBtn.addEventListener('click', function () {
      var ids = checks.filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
      if (!ids.length) { showToast('Marque ao menos um item', true); return; }
      payBtn.disabled = true;
      api('/api/pdv/tabs/' + tab.id + '/payments', {
        method: 'POST',
        body: JSON.stringify({ tabItemIds: ids, method: methodSelect.value, payerName: payerInput.value.trim() }),
      }).then(function () {
        showToast('Pagamento registrado');
        loadTabDetail(tab.id);
      }).catch(function (err) { showToast(err.message, true); payBtn.disabled = false; });
    });
    wrap.appendChild(payBtn);

    return wrap;
  }

  function renderReceipt(tab) {
    content.innerHTML = '';
    var back = el('button', 'back-link no-print', '← Voltar');
    back.addEventListener('click', function () { renderTabDetail(tab); });
    content.appendChild(back);

    var sheet = el('div', 'receipt');
    var head = el('div', 'receipt-head');
    var logo = el('img'); logo.src = 'assets/img/logo.png'; logo.alt = '';
    head.appendChild(logo);
    head.appendChild(el('div', 'receipt-brand', 'BRISA LOUNGE BAR'));
    head.appendChild(el('div', 'receipt-sub', esc(tab.label)));
    if (tab.customer_name) {
      var who = tab.customer_name + (tab.customer_phone ? ' · ' + tab.customer_phone : '');
      head.appendChild(el('div', 'receipt-sub', esc(who)));
    }
    sheet.appendChild(head);

    var lines = el('div', 'receipt-lines');
    tab.items.filter(function (it) { return it.status !== 'cancelado'; }).forEach(function (it) {
      var row = el('div', 'receipt-row');
      row.appendChild(el('span', '', it.qty + '× ' + esc(it.name)));
      row.appendChild(el('span', '', formatCents(it.unit_price_cents * it.qty)));
      lines.appendChild(row);
    });
    sheet.appendChild(lines);

    var totals = el('div', 'receipt-totals');
    function trow(label, value, strong) {
      var r = el('div', 'receipt-row' + (strong ? ' strong' : ''));
      r.appendChild(el('span', '', label));
      r.appendChild(el('span', '', formatCents(value)));
      return r;
    }
    totals.appendChild(trow('Total', tab.totalCents, true));
    totals.appendChild(trow('Pago', tab.paidCents));
    totals.appendChild(trow('Pendente', tab.pendingCents));
    sheet.appendChild(totals);

    if (tab.payments.length) {
      var payBlock = el('div', 'receipt-lines');
      tab.payments.forEach(function (p) {
        var row = el('div', 'receipt-row');
        row.appendChild(el('span', '', PAYMENT_METHOD_LABEL[p.method] || p.method));
        row.appendChild(el('span', '', formatCents(p.amount_cents)));
        payBlock.appendChild(row);
      });
      sheet.appendChild(payBlock);
    }

    sheet.appendChild(el('div', 'receipt-foot', 'brisaloungebar.com.br'));
    content.appendChild(sheet);

    var printBtn = el('button', 'btn no-print', 'Imprimir');
    printBtn.style.marginTop = '16px';
    printBtn.addEventListener('click', function () { window.print(); });
    content.appendChild(printBtn);
  }

  var SECTOR_LABEL = { bar_cozinha: 'Bar/Cozinha', tabacaria: 'Tabacaria' };

  function itemLine(it, tabId) {
    var line = el('div', 'item-line');
    var info = el('div', 'info');
    info.appendChild(el('div', 'nm', it.qty + '× ' + esc(it.name)));
    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'status-pill status-' + it.status, it.status));
    if (it.status !== 'cancelado') {
      meta.appendChild(el('span', 'status-pill ' + (it.paid ? 'status-entregue' : 'status-pendente'), it.paid ? 'pago' : 'a pagar'));
    }
    meta.appendChild(document.createTextNode(SECTOR_LABEL[it.sector] + ' · ' + esc(it.waiter_name || '—')));
    info.appendChild(meta);
    line.appendChild(info);
    line.appendChild(el('span', 'price', formatCents(it.unit_price_cents * it.qty)));

    if (it.status !== 'cancelado' && it.status !== 'entregue' && !it.paid) {
      var cancelBtn = el('button', 'cancel-x', '✕');
      cancelBtn.title = 'Cancelar este item';
      cancelBtn.addEventListener('click', function () {
        openManagerAuth('Cancelar "' + it.name + '" — confirme com usuário e senha de um gerente.', function (username, password) {
          return api('/api/pdv/tab-items/' + it.id, {
            method: 'PUT',
            body: JSON.stringify({ status: 'cancelado', managerUsername: username, managerPassword: password }),
          }).then(function () {
            showToast('Item cancelado');
            loadTabDetail(tabId);
          });
        });
      });
      line.appendChild(cancelBtn);
    }
    return line;
  }

  function itemPicker(tabId) {
    var wrap = el('div', 'picker-box');
    wrap.appendChild(el('div', 'panel-head', '<h2 style="font-size:0.98rem;margin:0;">Lançar item</h2>'));
    var input = el('input');
    input.type = 'search';
    input.placeholder = 'Buscar item pelo nome…';
    wrap.appendChild(input);
    var results = el('div', 'picker-results');
    wrap.appendChild(results);

    input.addEventListener('input', function () {
      var q = input.value.trim().toLowerCase();
      results.innerHTML = '';
      if (!q) return;
      loadCatalog().then(function (items) {
        var matches = items.filter(function (it) { return it.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 8);
        matches.forEach(function (it) {
          var row = el('button', 'picker-row');
          row.type = 'button';
          row.appendChild(el('span', 'nm', esc(it.name)));
          row.appendChild(el('span', 'pr', formatCents(it.priceCents)));
          row.addEventListener('click', function () {
            row.disabled = true;
            api('/api/pdv/tabs/' + tabId + '/items', { method: 'POST', body: JSON.stringify({ itemId: it.id }) })
              .then(function () {
                showToast(it.name + ' lançado');
                loadTabDetail(tabId);
              })
              .catch(function (err) { showToast(err.message, true); row.disabled = false; });
          });
          results.appendChild(row);
        });
        if (!matches.length) results.appendChild(el('p', 'empty-msg', 'Nada encontrado.'));
      });
    });

    return wrap;
  }

  /* ================================ SETORES ================================= */

  // Quatro colunas, uma sequência real: o pedido chega novo, o setor põe em
  // produção, avisa que está pronto, e some da tela do setor só depois que o
  // garçom de fato entrega — cada coluna pertence a quem faz aquela etapa.
  var KANBAN_COLUMNS = [
    { status: 'pendente',   title: 'Novo',              color: '--novo',       next: 'preparando', action: 'Iniciar preparo' },
    { status: 'preparando', title: 'Em produção',       color: '--producao',   next: 'pronto',     action: 'Marcar pronto' },
    { status: 'pronto',     title: 'Aguardando garçom', color: '--aguardando', next: 'entregue',   action: 'Entregar' },
    { status: 'entregue',   title: 'Entregue',          color: '--entregue',   next: null,         action: null },
  ];

  function elapsedMinutes(iso) {
    var ms = Date.now() - new Date(iso.replace(' ', 'T') + 'Z').getTime();
    return Math.max(0, Math.round(ms / 60000));
  }

  function loadSector(sector, title) {
    content.innerHTML = '';
    var head = el('div', 'panel-head');
    head.appendChild(el('h2', '', title));
    content.appendChild(head);

    var board = el('div', 'kanban');
    content.appendChild(board);

    var cols = {};
    KANBAN_COLUMNS.forEach(function (def) {
      var col = el('div', 'kanban-col');
      col.style.setProperty('--col-color', 'var(' + def.color + ')');
      var headRow = el('div', 'kanban-col-head');
      headRow.appendChild(el('span', '', def.title));
      var count = el('span', 'count', '0');
      headRow.appendChild(count);
      col.appendChild(headRow);
      var body = el('div', 'kanban-col-body');
      col.appendChild(body);
      board.appendChild(col);
      cols[def.status] = { body: body, count: count, def: def };
    });

    function refresh() {
      api('/api/pdv/sector/' + sector).then(function (data) {
        var buckets = { pendente: [], preparando: [], pronto: [], entregue: [] };
        data.items.forEach(function (it) { (buckets[it.status] || buckets.pendente).push(it); });

        KANBAN_COLUMNS.forEach(function (def) {
          var col = cols[def.status];
          var items = buckets[def.status];
          col.count.textContent = items.length;
          col.body.innerHTML = '';
          if (!items.length) {
            col.body.appendChild(el('p', 'kanban-empty', '—'));
            return;
          }
          items.forEach(function (it) { col.body.appendChild(kanbanCard(it, def, refresh)); });
        });
      }).catch(function (err) {
        board.innerHTML = '';
        board.appendChild(el('p', 'empty-msg', 'Erro ao carregar: ' + esc(err.message)));
      });
    }

    refresh();
    // A cozinha não fica olhando pra tela esperando: atualiza sozinha.
    sectorPoll = setInterval(refresh, 6000);
  }

  function kanbanCard(it, def, onChanged) {
    var card = el('div', 'kanban-card');
    card.appendChild(el('div', 'nm', it.qty + '× ' + esc(it.name)));
    card.appendChild(el('div', 'meta', esc(it.tab_label) + ' · ' + esc(it.waiter_name || '—') + ' · <span class="mono">' + elapsedMinutes(it.created_at) + ' min</span>'));
    if (it.note) card.appendChild(el('div', 'note', esc(it.note)));

    if (def.next) {
      var btn = el('button', '', def.action);
      btn.addEventListener('click', function () {
        btn.disabled = true;
        api('/api/pdv/tab-items/' + it.id, { method: 'PUT', body: JSON.stringify({ status: def.next }) })
          .then(onChanged).catch(function (err) { showToast(err.message, true); btn.disabled = false; });
      });
      card.appendChild(btn);
    }
    return card;
  }

  checkSession();
})();
</script>
</body>
</html>
