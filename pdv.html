<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV · Brisa Lounge Bar</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Jost';
    src: url('assets/fonts/jost.woff2') format('woff2');
    font-weight: 300 700;
    font-display: swap;
  }
  /* Ferramenta de operação, não vitrine: sem a serif da marca, paleta mais
     fria e mais dura, números em monoespaçada — cara de painel, não de site. */
  :root {
    --display: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --gold: #ffb400;
    --gold-light: #ffcc33;
    --black: #0a0c0f;
    --black-soft: #14171c;
    --card: #181c22;
    --card-2: #1e242c;
    --border: #2b313a;
    --border-soft: #21262e;
    --text: #eef1f5;
    --text-dim: #8b93a1;
    --danger: #ff5252;
    --ok: #22c55e;
    --novo: #3b82f6;
    --producao: #ffb400;
    --aguardando: #a855f7;
    --entregue: #22c55e;
    --teal: #2dd4bf;
    --orange: #fb923c;
    --pink: #f472b6;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);
    --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 400;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    /* Vinheta sutil em vez de preto chapado — dá profundidade sem parecer
       vitrine (a luz vem de cima, como um painel físico iluminado). */
    background:
      radial-gradient(1100px 620px at 50% -8%, color-mix(in srgb, var(--gold) 5%, transparent), transparent 60%),
      var(--black);
    background-attachment: fixed;
  }
  input, select, button { font-family: inherit; }
  .hidden { display: none !important; }
  a{ color: inherit; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 2px; }

  /* Barra de rolagem fina, no tom do painel — o padrão do sistema destoa. */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

  /* ------------------------------------------------------------- ícones --- */
  .icon {
    width: 1em; height: 1em; vertical-align: -0.15em;
    flex: 0 0 auto;
  }
  .icon-lg { width: 1.4em; height: 1.4em; }

  /* login — mesmo padrão do painel de cardápio */
  #view-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: linear-gradient(165deg, var(--card-2), var(--card));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 34px 26px;
    max-width: 340px;
    width: 100%;
    box-shadow: var(--shadow-lg);
  }
  .login-crest {
    width: 52px; height: 52px; margin: 0 auto 16px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--gold) 14%, transparent);
    color: var(--gold);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--gold) 30%, transparent);
  }
  .login-crest svg { width: 26px; height: 26px; }
  .login-box h1 {
    font-family: var(--display);
    font-weight: 700;
    color: var(--text);
    font-size: 1.15rem;
    letter-spacing: 1px;
    margin: 0 0 4px;
    text-align: center;
  }
  .login-box h1 .tag {
    display: inline-block; font-family: var(--mono); color: var(--gold);
    font-weight: 600; font-size: 0.62rem; letter-spacing: 1px;
    margin-left: 8px; padding: 2px 6px; border: 1px solid var(--gold); border-radius: 4px;
    vertical-align: middle; text-transform: uppercase;
  }
  .login-box p.sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    margin: 0 0 24px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--black-soft);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .field input:focus, .field select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 16%, transparent); }
  .btn {
    width: 100%;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: none;
    background: linear-gradient(165deg, var(--gold-light), var(--gold));
    color: var(--black);
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 3px 12px color-mix(in srgb, var(--gold) 30%, transparent);
    transition: transform 0.12s var(--ease), box-shadow 0.12s var(--ease), filter 0.12s var(--ease);
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(1px); box-shadow: 0 1px 6px color-mix(in srgb, var(--gold) 30%, transparent); }
  .btn:disabled { opacity: 0.55; cursor: default; transform: none; filter: none; box-shadow: none; }
  .btn-secondary {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: auto;
    box-shadow: none;
  }
  .btn-secondary:hover { border-color: var(--gold); color: var(--gold-light); }
  .btn-small { width: auto; padding: 8px 14px; font-size: 0.72rem; border-radius: 6px; }
  .error-box {
    background: color-mix(in srgb, var(--danger) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
    color: var(--danger);
    font-size: 0.8rem;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
  }

  /* dashboard */
  header.top {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--black-soft);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header.top .brand { font-family: var(--display); color: var(--text); font-weight: 700; letter-spacing: 0.5px; font-size: 1rem; text-transform: uppercase; }
  header.top .brand small { display: inline-block; font-family: var(--mono); color: var(--gold); font-weight: 600; font-size: 0.62rem; letter-spacing: 1px; margin-left: 8px; padding: 2px 6px; border: 1px solid var(--gold); border-radius: 4px; vertical-align: middle; }
  header.top .who { display: flex; align-items: center; gap: 12px; }
  header.top .who span { font-size: 0.76rem; color: var(--text-dim); text-align: right; }
  header.top .who span b { color: var(--text); display: block; font-weight: 500; }

  /* ---------------------------------------------------------- menu / func-bar --- */
  .func-bar {
    position: sticky;
    top: 61px;
    z-index: 19;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    background: var(--black-soft);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .func-bar .back-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: none;
    color: var(--gold-light);
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }
  .func-bar .back-btn:hover { border-color: var(--gold); }
  .func-bar .back-btn kbd {
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .func-bar .func-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
  }

  .home-greeting {
    max-width: 760px;
    margin: 0 auto;
    padding: 26px 16px 4px;
    font-family: var(--display);
    font-size: 1.25rem;
    font-weight: 300;
    color: var(--text-dim);
  }
  .home-greeting span { color: var(--gold-light); font-weight: 600; }
  @media (min-width: 640px) { .home-greeting { max-width: 940px; } }
  @media (min-width: 1000px) { .home-greeting { max-width: 1180px; font-size: 1.45rem; } }

  .home-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 16px 16px 50px;
    max-width: 760px;
    margin: 0 auto;
  }
  @media (min-width: 640px) {
    .home-grid { grid-template-columns: repeat(3, 1fr); max-width: 940px; }
  }
  @media (min-width: 1000px) {
    .home-grid { grid-template-columns: repeat(4, 1fr); max-width: 1180px; }
  }
  .home-card {
    background: linear-gradient(165deg, var(--card-2), var(--card));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: flex-start;
    text-align: left;
    cursor: pointer;
    min-height: 150px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
  }
  .home-card::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 3px;
    background: var(--accent, var(--gold));
  }
  .home-card:hover, .home-card:focus-visible {
    border-color: color-mix(in srgb, var(--accent, var(--gold)) 55%, var(--border));
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
  }
  .home-card-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
  .home-card-icon {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--accent, var(--gold)) 16%, transparent);
    color: var(--accent, var(--gold));
  }
  .home-card-icon .icon { width: 22px; height: 22px; stroke-width: 1.7; }
  .home-card .shortcut {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
  }
  .home-card-label-row { display: flex; align-items: center; gap: 8px; width: 100%; }
  .home-card .label {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.08rem;
    color: var(--text);
    letter-spacing: 0.2px;
  }
  .home-card .count-badge {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.7rem;
    background: color-mix(in srgb, var(--accent, var(--gold)) 22%, transparent);
    color: var(--accent, var(--gold-light));
    border-radius: 999px;
    padding: 2px 9px;
    margin-left: auto;
  }
  .home-card .count-badge.warn { background: color-mix(in srgb, var(--danger) 24%, transparent); color: var(--danger); }
  .home-card .desc { font-size: 0.78rem; color: var(--text-dim); line-height: 1.35; }

  @media (max-width: 480px) {
    .home-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px 12px 40px; }
    .home-card { padding: 18px 14px; min-height: 122px; }
    .home-greeting { font-size: 1.05rem; padding: 20px 14px 0; }
  }

  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }

  #toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--gold);
    color: var(--black);
    padding: 12px 22px;
    border-radius: 24px;
    font-weight: 700;
    font-size: 0.82rem;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); color: #fff; }

  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .panel-head h2 {
    color: var(--text); font-size: 1.2rem; margin: 0; font-family: var(--display);
    font-weight: 600; letter-spacing: 0.2px; display: flex; align-items: center; gap: 10px;
  }
  .panel-head h2 .icon { color: var(--gold); }

  .search-row { margin-bottom: 16px; position: relative; }
  .search-row .icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-dim); pointer-events: none;
  }
  .search-row input {
    width: 100%;
    padding: 12px 14px 12px 40px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--black-soft);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .search-row input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 16%, transparent); }
  .search-row select {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--black-soft);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }
  .search-row select:focus { border-color: var(--gold); }

  .plain-input {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--black-soft);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    margin-bottom: 4px;
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .plain-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 16%, transparent); }

  .row-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 15px 17px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease), border-color 0.15s var(--ease);
  }
  .row-card.clickable { cursor: pointer; }
  .row-card.clickable:hover { border-color: color-mix(in srgb, var(--gold) 45%, var(--border)); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .row-card .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tab-card-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 auto; }
  .row-card .name { font-weight: 600; font-size: 0.98rem; }
  .row-card .meta { color: var(--text-dim); font-size: 0.8rem; margin-top: 3px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .row-card .badge {
    font-size: 0.65rem; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 3px 9px; border-radius: 5px; font-weight: 600; white-space: nowrap;
  }
  .badge.role-gerente { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold-light); }
  .badge.role-caixa { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.role-garcom { background: color-mix(in srgb, var(--text-dim) 18%, transparent); color: var(--text-dim); }
  .badge.inactive { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .badge.amount { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold-light); }
  .badge.paid { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .row-card.overdue { border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
  .row-card.inactive-row { opacity: 0.6; }

  .row-card .actions { display: flex; gap: 8px; margin-top: 10px; }
  .row-card .actions button {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: none; color: var(--text-dim); font-size: 0.72rem; cursor: pointer;
    transition: border-color 0.15s var(--ease), color 0.15s var(--ease);
  }
  .row-card .actions button:hover { border-color: var(--gold); color: var(--gold); }

  .edit-form { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); display: none; }
  .edit-form.open { display: block; }
  .edit-form .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .edit-form input, .edit-form select {
    background: var(--black-soft); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 0.85rem; outline: none;
  }
  .edit-form input:focus, .edit-form select:focus { border-color: var(--gold); }
  .edit-form .name-input { flex: 1 1 160px; }
  .edit-form .small-input { flex: 1 1 110px; }
  .edit-form label.check { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-dim); flex: 0 0 auto; }
  .edit-form .save-row { display: flex; gap: 8px; }
  .edit-form .save-row button {
    padding: 8px 14px; border-radius: 6px; border: none; font-size: 0.76rem; cursor: pointer;
  }
  .edit-form .save-row .save { background: var(--gold); color: var(--black); font-weight: 600; }
  .edit-form .save-row .cancel { background: none; border: 1px solid var(--border); color: var(--text-dim); }

  .add-block { margin-top: 18px; }
  .add-block > button {
    width: 100%; padding: 12px; border-radius: 10px; border: 1px dashed var(--border);
    background: none; color: var(--text-dim); font-size: 0.82rem; cursor: pointer;
  }
  .add-block > button {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .add-block > button:hover { border-color: var(--gold); color: var(--gold-light); background: color-mix(in srgb, var(--gold) 6%, transparent); }
  .add-form-box {
    display: none; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-md); padding: 16px; margin-top: 10px; box-shadow: var(--shadow-sm);
  }
  .add-form-box.open { display: block; animation: dropIn 0.18s var(--ease); }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .add-form-box .grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .add-form-box input, .add-form-box select {
    background: var(--black-soft); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 9px 11px; font-size: 0.87rem; outline: none;
    transition: border-color 0.15s var(--ease);
  }
  .add-form-box input:focus, .add-form-box select:focus { border-color: var(--gold); }
  .add-form-box .name-input { flex: 1 1 100%; }
  .add-form-box .half { flex: 1 1 140px; }

  .empty-msg {
    color: var(--text-dim); text-align: center; padding: 46px 20px; font-size: 0.88rem;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .empty-msg .icon { width: 30px; height: 30px; color: var(--border); stroke-width: 1.3; }

  .stat-strip { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-chip {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 10px 16px; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow-sm);
    min-width: 96px;
  }
  .stat-chip .stat-value { font-family: var(--mono); font-weight: 700; font-size: 1.15rem; color: var(--gold-light); }
  .stat-chip .stat-label { font-size: 0.66rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; }
  .stat-chip.warn { border-color: color-mix(in srgb, var(--danger) 40%, var(--border)); }
  .stat-chip.warn .stat-value { color: var(--danger); }

  /* ------------------------------------------------------- mapa de mesas --- */
  /* Cada mesa é um bloco tocável, não uma linha de lista — é o que faz o
     garçom bater o olho e saber pra onde ir sem ler nada. */
  .mesa-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-bottom: 24px;
  }
  @media (min-width: 480px) { .mesa-grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 720px) { .mesa-grid { grid-template-columns: repeat(6, 1fr); } }
  .mesa-tile {
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-lg);
    border: 2px solid var(--mesa-color, var(--border));
    background: color-mix(in srgb, var(--mesa-color, var(--border)) 12%, var(--card));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 5px; cursor: pointer; padding: 8px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .mesa-tile:hover { transform: translateY(-2px) scale(1.03); box-shadow: var(--shadow-md); }
  .mesa-tile:disabled { opacity: 0.6; cursor: default; transform: none; }
  .mesa-tile .mesa-number { font-weight: 800; font-size: 1.4rem; color: var(--text); }
  .mesa-tile .mesa-status {
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--mesa-color, var(--text-dim)); font-weight: 700;
  }
  .mesa-tile .mesa-total { font-size: 0.72rem; color: var(--text-dim); font-weight: 600; }
  .mesa-tile.livre { --mesa-color: var(--ok); opacity: 0.65; }
  .mesa-tile.livre:hover { opacity: 1; }
  .mesa-tile.ocupada { --mesa-color: var(--producao); }
  .mesa-tile.aguardando { --mesa-color: var(--danger); animation: mesaPulse 2.2s ease-in-out infinite; }
  @keyframes mesaPulse {
    0%, 100% { box-shadow: var(--shadow-sm); }
    50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--danger) 22%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) { .mesa-tile.aguardando { animation: none; } }
  @media (min-width: 720px) {
    .mesa-tile .mesa-number { font-size: 1.7rem; }
    .mesa-tile .mesa-total { font-size: 0.8rem; }
  }

  .row-icon {
    width: 36px; height: 36px; border-radius: 10px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--gold) 14%, transparent); color: var(--gold);
  }
  .row-icon .icon { width: 18px; height: 18px; }
  .dot-sep { opacity: 0.5; margin: 0 1px; }
  .row-card .meta .icon { width: 12px; height: 12px; opacity: 0.8; }
  .meta-bit { display: inline-flex; align-items: center; gap: 4px; }

  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--accent, var(--gold)) 20%, transparent);
    color: var(--accent, var(--gold));
    font-family: var(--display); font-weight: 700; font-size: 0.92rem; letter-spacing: 0.5px;
  }
  .badge.birthday {
    display: inline-flex; align-items: center; gap: 4px;
    background: color-mix(in srgb, var(--pink) 20%, transparent); color: var(--pink);
  }
  .badge.birthday .icon { width: 11px; height: 11px; }

  @media (max-width: 480px) {
    header.top { flex-wrap: wrap; }
    header.top .who span { text-align: left; }
  }

  /* --------------------------------------------------------- comandas --- */
  .back-link {
    background: none; border: none; color: var(--gold-light); font-size: 0.82rem; font-weight: 600;
    cursor: pointer; padding: 0 0 14px; display: flex; align-items: center; gap: 6px;
    transition: color 0.15s var(--ease), gap 0.15s var(--ease);
  }
  .back-link:hover { color: var(--gold); gap: 9px; }
  /* Resumo de pagamento da comanda: total grande, barra de progresso
     pago/pendente, linhas com pontinho de cor — pensado pra ler de relance
     no meio do movimento, sem precisar somar nada de cabeça. */
  .summary-card {
    background: linear-gradient(165deg, var(--card-2), var(--card));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-md);
  }
  .summary-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 10px; }
  .summary-label { font-size: 0.78rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .summary-total { font-size: 1.7rem; font-weight: 700; color: var(--gold-light); }
  .summary-bar {
    height: 7px; border-radius: 999px; margin-bottom: 14px; overflow: hidden;
    background: color-mix(in srgb, var(--danger) 22%, var(--black-soft));
  }
  .summary-bar-fill {
    height: 100%; border-radius: 999px; transition: width 0.3s var(--ease);
    background: linear-gradient(90deg, var(--ok), color-mix(in srgb, var(--ok) 65%, var(--gold-light)));
  }
  .summary-rows { display: flex; gap: 22px; flex-wrap: wrap; }
  .summary-row { display: flex; align-items: center; gap: 7px; font-size: 0.85rem; color: var(--text-dim); }
  .summary-row b { color: var(--text); margin-left: 2px; font-weight: 600; }
  .summary-row .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .summary-row .dot.ok { background: var(--ok); }
  .summary-row .dot.danger { background: var(--danger); }

  .section-head { display: flex; align-items: center; gap: 9px; margin: 24px 0 12px; }
  .section-head:first-child { margin-top: 0; }
  .section-head .icon { color: var(--gold); }
  .section-head h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 0.92rem; color: var(--text); letter-spacing: 0.2px; }

  .status-pill {
    font-size: 0.62rem; letter-spacing: 0.4px; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px; font-weight: 600; white-space: nowrap;
  }
  .status-pendente { background: color-mix(in srgb, var(--novo) 18%, transparent); color: var(--novo); }
  .status-preparando { background: color-mix(in srgb, var(--producao) 20%, transparent); color: var(--gold-light); }
  .status-entregue { background: color-mix(in srgb, var(--entregue) 18%, transparent); color: var(--entregue); }
  .status-pronto { background: color-mix(in srgb, var(--aguardando) 20%, transparent); color: var(--aguardando); }
  .status-cancelado { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); text-decoration: line-through; }

  .item-line {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; border-bottom: 1px dashed var(--border);
  }
  .item-line:last-child { border-bottom: none; }
  .item-line .sector-icon {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--text-dim) 14%, transparent); color: var(--text-dim);
  }
  .item-line .sector-icon .icon { width: 15px; height: 15px; }
  .item-line .info { flex: 1 1 auto; min-width: 0; }
  .item-line .info .nm { font-size: 0.92rem; }
  .item-line .info .meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .item-line .price { font-size: 0.9rem; color: var(--gold-light); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item-line .cancel-x {
    background: none; border: none; color: var(--text-dim);
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex: 0 0 auto; transition: all 0.15s var(--ease);
  }
  .item-line .cancel-x .icon { width: 14px; height: 14px; }
  .item-line .cancel-x:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }

  .picker-box { margin-top: 18px; position: relative; }
  .picker-box .search-row { margin-bottom: 0; }
  .picker-results { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .picker-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 13px; cursor: pointer; text-align: left; width: 100%;
    transition: border-color 0.15s var(--ease), transform 0.1s var(--ease);
  }
  .picker-row:hover { border-color: var(--gold); transform: translateY(-1px); }
  .picker-row .nm { font-size: 0.88rem; }
  .picker-row .pr { font-size: 0.86rem; color: var(--gold-light); font-variant-numeric: tabular-nums; }

  /* Método de pagamento como botões grandes, não um <select> escondido —
     é assim que um POS de verdade se toca no balcão. */
  .method-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
  .method-btn {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    flex: 1 1 76px; padding: 12px 8px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--black-soft); color: var(--text-dim);
    font-size: 0.72rem; cursor: pointer; transition: all 0.15s var(--ease);
  }
  .method-btn .icon { width: 18px; height: 18px; }
  .method-btn:hover { border-color: color-mix(in srgb, var(--gold) 45%, var(--border)); color: var(--text); }
  .method-btn.active { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, transparent); color: var(--gold-light); }

  /* Linha de item selecionável no fechamento — checkbox de verdade por
     baixo (acessível), visual de cartão marcável por cima. */
  .pay-row {
    position: relative; display: flex; align-items: center; gap: 12px;
    background: var(--black-soft); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 14px; margin-bottom: 8px; cursor: pointer;
    transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
  }
  .pay-row:hover { border-color: color-mix(in srgb, var(--gold) 45%, var(--border)); }
  .pay-row:has(.pay-row-check:checked) { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 8%, var(--black-soft)); }
  .pay-row-check { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .pay-row-check-visual {
    width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
    color: transparent; transition: all 0.15s var(--ease);
  }
  .pay-row-check-visual .icon { width: 13px; height: 13px; }
  .pay-row-check:checked + .pay-row-check-visual { background: var(--gold); border-color: var(--gold); color: var(--black); }
  .pay-row-name { flex: 1 1 auto; font-size: 0.88rem; }
  .pay-row-price { font-size: 0.86rem; color: var(--gold-light); font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------ kanban --- */
  /* Tela de cozinha, não página de site: no monitor do bar ela toma a tela
     inteira, as quatro colunas ficam visíveis de uma vez e cada uma rola por
     dentro. As telas de mão (comandas, clientes) continuam no container
     estreito — só o quadro escapa dele. */
  body.board-mode main { max-width: none; padding: 0; }

  .board-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px 0;
  }
  .board-head h2 {
    margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--text);
    text-transform: uppercase; letter-spacing: 0.6px;
    display: flex; align-items: center; gap: 9px;
  }
  .board-head h2 .icon { color: var(--gold); }
  .board-head .live {
    display: flex; align-items: center; gap: 7px;
    font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .board-head .live .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 70%, transparent);
    animation: livePulse 2.4s ease-out infinite;
  }
  @keyframes livePulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 70%, transparent); }
    70%  { box-shadow: 0 0 0 7px color-mix(in srgb, var(--ok) 0%, transparent); }
    100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 0%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) {
    .board-head .live .dot { animation: none; }
  }
  .board-head-right { display: flex; align-items: center; gap: 12px; }
  .board-head .mute-btn {
    display: flex; align-items: center; gap: 7px;
    font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; cursor: pointer;
  }
  .board-head .mute-btn:hover { border-color: var(--gold); }
  .board-head .mute-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .board-head .mute-btn.muted { color: var(--text-dim); }
  .board-head .mute-btn.muted .dot { background: var(--text-dim); }

  .kanban {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity;
    padding: 12px 16px 16px;
  }
  .kanban-col { flex: 0 0 260px; scroll-snap-align: start; display: flex; flex-direction: column; min-height: 0; }
  .kanban-col-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-radius: 6px 6px 0 0;
    font-weight: 700; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--black); background: var(--col-color);
  }
  .kanban-col-head .count {
    font-family: var(--mono); background: rgba(0,0,0,0.25);
    padding: 1px 8px; border-radius: 4px; font-size: 0.76rem; font-weight: 700;
  }
  .kanban-col-body {
    flex: 1 1 auto; min-height: 90px; background: var(--black-soft);
    border: 1px solid var(--border); border-top: none; border-radius: 0 0 6px 6px;
    padding: 10px; display: flex; flex-direction: column; gap: 9px;
  }
  .kanban-card {
    background: linear-gradient(165deg, var(--card-2), var(--card)); border: 1px solid var(--border);
    border-left: 4px solid var(--col-color);
    border-radius: 8px; padding: 11px 12px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s var(--ease), transform 0.15s var(--ease);
  }
  .kanban-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .kanban-card .card-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  .kanban-card .nm { font-weight: 700; font-size: 1rem; line-height: 1.25; }
  .kanban-card .nm .qty {
    font-family: var(--mono); color: var(--col-color); margin-right: 3px;
  }
  /* O tempo é a informação que decide a próxima ação numa cozinha cheia —
     por isso ganha peso próprio e muda de cor conforme o pedido envelhece. */
  .kanban-card .age {
    flex: 0 0 auto; font-family: var(--mono); font-size: 0.74rem; font-weight: 600;
    padding: 2px 7px; border-radius: 4px; white-space: nowrap;
    background: color-mix(in srgb, var(--text-dim) 16%, transparent); color: var(--text-dim);
  }
  .kanban-card.age-warn .age { background: color-mix(in srgb, var(--producao) 20%, transparent); color: var(--gold-light); }
  .kanban-card.age-late .age { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger); }
  .kanban-card.age-late { border-color: color-mix(in srgb, var(--danger) 45%, transparent); }

  .kanban-card .tab-label {
    display: inline-block; margin-top: 7px; font-size: 0.78rem; font-weight: 600;
    color: var(--text); background: var(--black-soft);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px;
  }
  .kanban-card .waiter { color: var(--text-dim); font-size: 0.74rem; margin-top: 6px; }
  .kanban-card .note {
    color: var(--gold-light); font-size: 0.8rem; margin-top: 7px; padding: 5px 8px;
    background: color-mix(in srgb, var(--producao) 12%, transparent);
    border-radius: 4px; line-height: 1.35;
  }
  .kanban-card button {
    width: 100%; margin-top: 10px; padding: 10px; border-radius: 6px; border: none;
    background: var(--col-color); color: var(--black); font-weight: 700; font-size: 0.74rem;
    text-transform: uppercase; letter-spacing: 0.4px; cursor: pointer;
  }
  .kanban-card button:hover { filter: brightness(1.1); }
  .kanban-card button:disabled { opacity: 0.5; cursor: default; }
  .kanban-empty { color: var(--text-dim); font-size: 0.78rem; text-align: center; padding: 18px 0; margin: auto 0; opacity: 0.5; }

  /* Tablet: quatro colunas lado a lado ficariam estreitas demais pro nome do
     item, e esconder coluna atrás de rolagem é justamente o que se quer
     evitar num quadro — então 2×2, tudo visível. */
  @media (min-width: 640px) and (max-width: 899px) {
    .kanban {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      overflow: visible;
    }
    .kanban-col { min-height: 220px; }
  }

  /* No monitor do bar: quatro colunas lado a lado, ocupando a altura toda,
     cada uma rolando por dentro em vez da página inteira rolar. */
  @media (min-width: 900px) {
    /* A área útil é a tela menos o cabeçalho fixo; dentro dela, o título do
       quadro toma o que precisa e o quadro fica com o resto exato — assim
       nada passa da dobra mesmo quando o cabeçalho muda de altura. */
    body.board-mode main {
      height: calc(100dvh - var(--chrome-h, 104px));
      display: flex;
      flex-direction: column;
    }
    .kanban {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      overflow: visible;
      flex: 1 1 auto;
      min-height: 0;
      padding: 14px 18px 18px;
    }
    .kanban-col-body { overflow-y: auto; }
    .kanban-card .nm { font-size: 1.08rem; }
    .kanban-card .age { font-size: 0.78rem; }
    .board-head { padding: 14px 18px 0; }
  }

  /* Monitor grande (TV/tela de cozinha): tudo cresce junto, pra ler de longe. */
  @media (min-width: 1500px) {
    .kanban { gap: 18px; padding: 18px 24px 24px; }
    .kanban-card { padding: 14px 15px; }
    .kanban-card .nm { font-size: 1.24rem; }
    .kanban-card .tab-label { font-size: 0.88rem; }
    .kanban-card .age { font-size: 0.86rem; }
    .kanban-card button { padding: 12px; font-size: 0.82rem; }
    .kanban-col-head { padding: 12px 14px; font-size: 0.84rem; }
    .board-head h2 { font-size: 1.25rem; }
  }

  /* ------------------------------------------------------------ cupom --- */
  .receipt {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 22px 20px; max-width: 360px; margin: 0 auto;
  }
  .receipt-head { text-align: center; margin-bottom: 16px; }
  .receipt-head img { width: 44px; margin: 0 auto 8px; }
  .receipt-brand { font-family: var(--display); color: var(--gold); font-weight: 600; letter-spacing: 2px; font-size: 0.95rem; }
  .receipt-sub { color: var(--text-dim); font-size: 0.82rem; margin-top: 4px; }
  .receipt-lines { padding: 10px 0; border-top: 1px dashed var(--border); }
  .receipt-row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.86rem; padding: 4px 0; }
  .receipt-row.strong { font-weight: 700; color: var(--gold-light); font-size: 0.98rem; }
  .receipt-totals { padding: 6px 0; border-top: 1px dashed var(--border); }
  .receipt-foot { text-align: center; color: var(--text-dim); font-size: 0.7rem; margin-top: 14px; letter-spacing: 0.5px; }

  /* -------------------------------------------------------------- modal --- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-box {
    background: linear-gradient(165deg, var(--card-2), var(--card));
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 24px 22px; max-width: 340px; width: 100%;
    box-shadow: var(--shadow-lg);
    animation: nocPop 0.2s var(--ease);
  }
  .modal-box h3 {
    margin: 0 0 6px; color: var(--gold); font-family: var(--display);
    font-weight: 600; font-size: 1.05rem;
    display: flex; align-items: center; gap: 8px;
  }
  .modal-msg { color: var(--text-dim); font-size: 0.86rem; margin: 0 0 16px; line-height: 1.4; }
  .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
  .modal-actions button { flex: 1 1 auto; }

  /* ------------------------------------------------------ alerta de pedido --- */
  /* Puramente visual/sonoro (pointer-events: none): avisa quem está olhando o
     quadro sem travar cliques em outros itens durante a animação. */
  .new-order-flash {
    position: fixed;
    inset: 0;
    z-index: 250;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .new-order-flash.show { opacity: 1; animation: nocPulseBg 1s ease-in-out infinite; }
  @keyframes nocPulseBg {
    0%, 100% { background-color: transparent; }
    50% { background-color: color-mix(in srgb, var(--gold) 20%, transparent); }
  }
  .noc-box { text-align: center; }
  .noc-label {
    display: inline-block;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(1.8rem, 7vw, 4.2rem);
    color: var(--black);
    background: var(--gold);
    padding: 14px 34px;
    border-radius: 16px;
    letter-spacing: 3px;
    text-transform: uppercase;
    box-shadow: 0 0 70px color-mix(in srgb, var(--gold) 65%, transparent);
    animation: nocPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .noc-items {
    display: block;
    margin-top: 18px;
    font-family: var(--mono);
    font-size: clamp(0.95rem, 3vw, 1.5rem);
    color: var(--text);
    background: var(--black-soft);
    border: 1px solid var(--border);
    padding: 10px 22px;
    border-radius: 10px;
  }
  @keyframes nocPop {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .new-order-flash.show { animation: none; }
    .noc-label { animation: none; }
  }

  @media print {
    header.top, .func-bar, #toast, .no-print { display: none !important; }
    body, main { background: #fff !important; }
    main { padding: 0 !important; max-width: none !important; }
    .receipt {
      background: #fff !important; border: none !important; color: #000 !important;
      max-width: none !important; padding: 0 !important;
    }
    .receipt-brand, .receipt-row.strong { color: #000 !important; }
    .receipt-sub, .receipt-foot { color: #444 !important; }
  }
</style>
</head>
<body>

<div id="view-login">
  <div class="login-box">
    <div class="login-crest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8l4 3 5-6 5 6 4-3-2 11H5L3 8Z"/><path d="M5 19h14"/>
      </svg>
    </div>
    <h1>BRISA <span class="tag">PDV</span></h1>
    <p class="sub">Login de funcionário</p>
    <div id="loginError" class="error-box hidden"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Usuário</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>
</div>

<div id="view-dashboard" class="hidden">
  <header class="top">
    <div class="brand">BRISA <small>PDV</small></div>
    <div class="who">
      <span id="whoami"></span>
      <button id="logoutBtn" class="btn btn-secondary btn-small">Sair</button>
    </div>
  </header>
  <div class="func-bar hidden" id="funcBar">
    <button id="homeBtn" class="back-btn" type="button">← Menu <kbd>Esc</kbd></button>
    <span class="func-title" id="funcTitle"></span>
  </div>
  <div id="home"></div>
  <main id="content" class="hidden"></main>
</div>

<div id="toast"></div>

<div id="newOrderFlash" class="new-order-flash hidden">
  <div class="noc-box">
    <div class="noc-label">Novo pedido</div>
    <div class="noc-items" id="newOrderItems"></div>
  </div>
</div>

<div id="managerAuthOverlay" class="modal-overlay hidden">
  <div class="modal-box">
    <h3><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Autorização de gerência</h3>
    <p class="modal-msg" id="managerAuthMsg"></p>
    <div class="field">
      <label for="managerAuthUser">Usuário do gerente</label>
      <input type="text" id="managerAuthUser" autocomplete="off">
    </div>
    <div class="field">
      <label for="managerAuthPass">Senha</label>
      <input type="password" id="managerAuthPass" autocomplete="off">
    </div>
    <div id="managerAuthError" class="error-box hidden"></div>
    <div class="modal-actions">
      <button id="managerAuthCancel" class="btn btn-secondary" type="button">Cancelar</button>
      <button id="managerAuthConfirm" class="btn" type="button">Confirmar</button>
    </div>
  </div>
</div>

<script>
(function () {
  var viewLogin = document.getElementById('view-login');
  var viewDashboard = document.getElementById('view-dashboard');
  var loginForm = document.getElementById('loginForm');
  var loginError = document.getElementById('loginError');
  var logoutBtn = document.getElementById('logoutBtn');
  var content = document.getElementById('content');
  var toast = document.getElementById('toast');
  var whoami = document.getElementById('whoami');
  var mgrOverlay = document.getElementById('managerAuthOverlay');
  var mgrMsg = document.getElementById('managerAuthMsg');
  var mgrUser = document.getElementById('managerAuthUser');
  var mgrPass = document.getElementById('managerAuthPass');
  var mgrError = document.getElementById('managerAuthError');
  var mgrCancelBtn = document.getElementById('managerAuthCancel');
  var mgrConfirmBtn = document.getElementById('managerAuthConfirm');
  var home = document.getElementById('home');
  var funcBar = document.getElementById('funcBar');
  var funcTitle = document.getElementById('funcTitle');
  var homeBtn = document.getElementById('homeBtn');
  var newOrderFlash = document.getElementById('newOrderFlash');
  var newOrderItemsEl = document.getElementById('newOrderItems');

  // Cada bloco do menu inicial. roles ausente = qualquer funcionário logado
  // vê; presente = só quem tem um desses cargos (mesma trava que a API já
  // aplica nas rotas — isto aqui é só pra não nem mostrar o bloco).
  var FUNCTIONS = [
    { key: 'comandas', icon: 'ticket', accent: '--gold', label: 'Comandas', desc: 'Abrir, lançar pedido e fechar conta' },
    { key: 'bar_cozinha', icon: 'flame', accent: '--novo', label: 'Bar/Cozinha', desc: 'Quadro de preparo' },
    { key: 'tabacaria', icon: 'wind', accent: '--aguardando', label: 'Tabacaria', desc: 'Quadro de preparo' },
    { key: 'clientes', icon: 'user', accent: '--teal', label: 'Clientes', desc: 'Cadastro e busca' },
    { key: 'estoque', icon: 'box', accent: '--orange', label: 'Estoque', desc: 'Contagem manual', roles: ['caixa', 'gerente'] },
    { key: 'financeiro', icon: 'wallet', accent: '--ok', label: 'Financeiro', desc: 'Despesas e vencimentos', roles: ['caixa', 'gerente'] },
    { key: 'funcionarios', icon: 'users', accent: '--pink', label: 'Funcionários', desc: 'Cadastro da equipe', roles: ['gerente'] },
  ];

  var ROLE_LABEL = { gerente: 'Gerente', caixa: 'Caixa', garcom: 'Garçom' };
  var me = null;
  var activeTab = null;
  var currentBack = null;  // o que o ESC (ou o botão "← Menu") faz na tela atual
  var sectorPoll = null;   // intervalo de atualização das telas de setor
  var catalogCache = null; // /api/pdv/catalog, buscado uma vez e reaproveitado
  var newOrderFlashTimer = null;
  var audioCtx = null;     // criado só no primeiro clique/tecla (autoplay de som exige gesto do usuário)

  function showToast(msg, isError) {
    toast.textContent = msg;
    toast.classList.toggle('error', !!isError);
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    opts.credentials = 'same-origin';
    return fetch(path, opts).then(function (res) {
      return res.json().then(function (data) {
        if (!res.ok) throw new Error(data.error || 'Erro');
        return data;
      });
    });
  }

  function el(tag, className, html) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Ícones de linha, desenhados na mão (sem depender de CDN nem de fonte de
  // ícone externa — o app precisa abrir igual numa wifi de bar ruim).
  var ICON_PATHS = {
    ticket: '<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4Z"/><path d="M13 6.5v2M13 11v2M13 15.5v2"/>',
    flame: '<path d="M12 21c-3.3 0-6-2.4-6-6 0-3 2-5 3-8 .5 2 2 2.5 2 4.5 0-3 2-4 2-7 3 2 5 6 5 10.5 0 3.6-2.7 6-6 6Z"/>',
    wind: '<path d="M3 7.5h11a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16.5h9a2.5 2.5 0 1 1-2.5 2.5"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M2.3 21c0-3.4 3-5.2 6.7-5.2s6.7 1.8 6.7 5.2"/><circle cx="17.3" cy="9" r="2.6"/><path d="M15.5 15.6c2.7.5 4.7 2.1 4.7 5.4"/>',
    box: '<path d="M3 8l9-5 9 5-9 5-9-5Z"/><path d="M3 8v9l9 5 9-5V8"/><path d="M12 13v9"/>',
    wallet: '<rect x="3" y="6" width="18" height="13" rx="2.2"/><path d="M3 10.5h18"/><circle cx="17" cy="14.5" r="1.1"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    arrowLeft: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
    alert: '<path d="M12 3 2 20h20L12 3Z"/><path d="M12 9v5M12 17h.01"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    cake: '<path d="M4 21v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6"/><path d="M4 17h16"/><path d="M8 13V9M12 13V9M16 13V9"/><path d="M8 5.8c0-1 .6-1.4.6-2.4S8 1.5 8 1.5M12 5.8c0-1 .6-1.4.6-2.4s-.6-1.9-.6-1.9M16 5.8c0-1 .6-1.4.6-2.4s-.6-1.9-.6-1.9"/>',
    phone: '<path d="M6 3h3l1.5 4.5-2 1.5a12 12 0 0 0 6 6l1.5-2L20 15v3a2 2 0 0 1-2 2C10 20 4 14 4 6a2 2 0 0 1 2-3Z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    crown: '<path d="M3 8l4 3 5-6 5 6 4-3-2 11H5L3 8Z"/><path d="M5 19h14"/>',
    receipt: '<path d="M6 3h12v18l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.5V3Z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
    cash: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 10v.01M18 14v.01"/>',
    card: '<rect x="2" y="5" width="20" height="14" rx="2.4"/><path d="M2 10h20"/>',
    bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/>',
    more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
    repeat: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
    tag: '<path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9-9-9Z"/><circle cx="8" cy="8" r="1.3"/>',
    edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  };
  function icon(name, cls) {
    return '<svg class="icon' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
      (ICON_PATHS[name] || '') + '</svg>';
  }

  // Tela vazia com ícone — reaproveitada em toda lista do app em vez de um
  // texto cinza solto.
  function emptyState(iconName, message) {
    var wrap = el('p', 'empty-msg');
    wrap.innerHTML = icon(iconName, 'icon-lg') + '<span>' + esc(message) + '</span>';
    return wrap;
  }

  // Chip de número em destaque (ex: "12 comandas abertas") — usado nas tiras
  // de resumo no topo de Comandas, Clientes, Estoque e Financeiro.
  function statChip(value, label, warn) {
    var chip = el('div', 'stat-chip' + (warn ? ' warn' : ''));
    chip.appendChild(el('span', 'stat-value', esc(value)));
    chip.appendChild(el('span', 'stat-label', esc(label)));
    return chip;
  }

  function fmtElapsed(mins) {
    if (mins < 60) return mins + 'min';
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + 'h' + (m ? ' ' + m + 'min' : '');
  }

  // Cabeçalho de subseção com ícone — troca os `<h2 style="...">` soltos
  // que existiam antes por um componente único.
  function sectionHead(iconName, title) {
    var h = el('div', 'section-head');
    h.innerHTML = icon(iconName) + '<h3>' + esc(title) + '</h3>';
    return h;
  }

  var PAYMENT_METHODS_UI = [
    { key: 'dinheiro', label: 'Dinheiro', icon: 'cash' },
    { key: 'pix', label: 'Pix', icon: 'bolt' },
    { key: 'debito', label: 'Débito', icon: 'card' },
    { key: 'credito', label: 'Crédito', icon: 'card' },
    { key: 'outro', label: 'Outro', icon: 'more' },
  ];

  // Pede usuário + senha de um gerente antes de fazer algo sensível (hoje só
  // cancelar item). `action(username, password)` deve devolver uma Promise —
  // se ela rejeitar, o erro aparece dentro do modal e a pessoa pode tentar de
  // novo sem refazer o fluxo inteiro; se resolver, o modal fecha sozinho.
  function openManagerAuth(message, action) {
    mgrMsg.textContent = message;
    mgrUser.value = '';
    mgrPass.value = '';
    mgrError.classList.add('hidden');
    mgrConfirmBtn.disabled = false;
    mgrOverlay.classList.remove('hidden');
    mgrUser.focus();

    mgrConfirmBtn.onclick = function () {
      var username = mgrUser.value.trim();
      var password = mgrPass.value;
      if (!username || !password) {
        mgrError.textContent = 'Preencha usuário e senha';
        mgrError.classList.remove('hidden');
        return;
      }
      mgrError.classList.add('hidden');
      mgrConfirmBtn.disabled = true;
      action(username, password).then(function () {
        mgrOverlay.classList.add('hidden');
      }).catch(function (err) {
        mgrError.textContent = err.message;
        mgrError.classList.remove('hidden');
      }).finally(function () {
        mgrConfirmBtn.disabled = false;
      });
    };
    mgrCancelBtn.onclick = function () { mgrOverlay.classList.add('hidden'); };
  }

  function checkSession() {
    api('/api/pdv/me').then(function (data) {
      me = data;
      showDashboard();
    }).catch(function () {
      showLogin();
    });
  }

  function showLogin() {
    viewLogin.classList.remove('hidden');
    viewDashboard.classList.add('hidden');
  }

  // Lembrar a última tela sobrevive a um F5 no meio do turno — mas só o
  // bloco de nível superior (Comandas volta pra lista, não pra comanda
  // específica que estava aberta): guardar o estado aninhado inteiro exigiria
  // persistir ids e refazer a navegação, e não foi o que pediram.
  function rememberScreen(key) {
    try { sessionStorage.setItem('pdv_screen', key); } catch (e) {}
  }
  function forgetScreen() {
    try { sessionStorage.removeItem('pdv_screen'); } catch (e) {}
  }
  function recallScreen() {
    try { return sessionStorage.getItem('pdv_screen'); } catch (e) { return null; }
  }

  function visibleFunctions() {
    return FUNCTIONS.filter(function (f) { return !f.roles || f.roles.indexOf(me.role) !== -1; });
  }

  function showDashboard() {
    viewLogin.classList.add('hidden');
    viewDashboard.classList.remove('hidden');
    whoami.innerHTML = '<b>' + esc(me.name) + '</b>' + ROLE_LABEL[me.role];
    var saved = recallScreen();
    var def = saved && visibleFunctions().filter(function (f) { return f.key === saved; })[0];
    if (def) openFunction(def.key, def.label);
    else goHome();
  }

  function renderHome() {
    home.innerHTML = '';
    var greeting = el('div', 'home-greeting');
    greeting.innerHTML = 'Boa <span>' + partOfDay() + '</span>, ' + esc((me.name || '').split(' ')[0]) + '.';
    home.appendChild(greeting);

    var grid = el('div', 'home-grid');
    visibleFunctions().forEach(function (f, i) {
      var card = el('button', 'home-card');
      card.type = 'button';
      card.style.setProperty('--accent', 'var(' + f.accent + ')');
      var top = el('div', 'home-card-top');
      top.appendChild(el('span', 'home-card-icon', icon(f.icon)));
      if (i < 9) top.appendChild(el('span', 'shortcut', String(i + 1)));
      card.appendChild(top);
      var labelRow = el('div', 'home-card-label-row');
      labelRow.appendChild(el('span', 'label', f.label));
      var badge = el('span', 'count-badge hidden');
      labelRow.appendChild(badge);
      card.appendChild(labelRow);
      card.appendChild(el('span', 'desc', f.desc));
      card.addEventListener('click', function () { openFunction(f.key, f.label); });
      grid.appendChild(card);
      loadHomeCount(f.key, badge);
    });
    home.appendChild(grid);
  }

  function partOfDay() {
    var h = new Date().getHours();
    if (h < 12) return 'manhã';
    if (h < 18) return 'tarde';
    return 'noite';
  }

  // Número que aparece ao lado de cada bloco: quanto tem pra olhar ali agora,
  // sem precisar entrar. Um tiro só por visita ao menu, não fica sondando
  // em segundo plano.
  function loadHomeCount(key, badge) {
    function show(n, warn) {
      if (!n) return;
      badge.textContent = n;
      badge.classList.toggle('warn', !!warn);
      badge.classList.remove('hidden');
    }
    if (key === 'comandas') {
      api('/api/pdv/tabs?status=aberta').then(function (d) { show(d.tabs.length); }).catch(function () {});
    } else if (key === 'bar_cozinha' || key === 'tabacaria') {
      api('/api/pdv/sector/' + key).then(function (d) {
        var n = d.items.filter(function (it) { return it.status !== 'entregue'; }).length;
        show(n, n > 0);
      }).catch(function () {});
    } else if (key === 'financeiro') {
      api('/api/pdv/expenses?status=aberta').then(function (d) { show(d.expenses.length); }).catch(function () {});
    } else if (key === 'estoque') {
      api('/api/pdv/stock').then(function (d) {
        var low = d.stock.filter(function (s) { return s.min_qty !== null && Number(s.qty) < Number(s.min_qty); }).length;
        show(low, low > 0);
      }).catch(function () {});
    }
  }

  // Volta pro menu inicial — chamado pelo botão "← Menu", pelo ESC (quando
  // nenhuma tela aninhada tem um back mais específico) e ao logar.
  function goHome() {
    stopNewOrderFlash();
    clearInterval(sectorPoll);
    sectorPoll = null;
    document.body.classList.remove('board-mode');
    activeTab = null;
    currentBack = null;
    forgetScreen();
    content.classList.add('hidden');
    funcBar.classList.add('hidden');
    home.classList.remove('hidden');
    renderHome();
  }
  homeBtn.addEventListener('click', goHome);

  // Cada bloco do menu abre em tela cheia: esconde o menu, mostra o
  // conteúdo, e o ESC (ou o botão "← Menu") volta — currentBack pode ser
  // trocado por uma tela aninhada (ex: dentro de uma comanda) pra voltar um
  // nível de cada vez em vez de pular direto pro menu.
  function openFunction(key, label) {
    activeTab = key;
    home.classList.add('hidden');
    content.classList.remove('hidden');
    funcBar.classList.remove('hidden');
    funcTitle.textContent = label;
    currentBack = goHome;
    rememberScreen(key);
    loadTab();
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!mgrOverlay.classList.contains('hidden')) { mgrCancelBtn.click(); return; }
      if (currentBack) currentBack();
      return;
    }
    // Atalho 1-9 só faz sentido parado no menu inicial, logado, sem modal
    // aberto — em qualquer tela de função já tem campo de texto podendo
    // estar em foco, e um número ali é pra digitar, não pra navegar.
    if (activeTab !== null || !me || viewDashboard.classList.contains('hidden')) return;
    if (!mgrOverlay.classList.contains('hidden')) return;
    if (e.key < '1' || e.key > '9') return;
    var target = visibleFunctions()[Number(e.key) - 1];
    if (target) openFunction(target.key, target.label);
  });

  // O quadro precisa saber onde o cabeçalho fixo termina pra ocupar o resto
  // da tela exatamente. Medir é mais confiável que chutar um valor fixo, que
  // erra assim que o cabeçalho quebra em duas linhas num monitor estreito.
  function syncChromeHeight() {
    var header = document.querySelector('header.top');
    var bar = document.querySelector('.func-bar');
    if (!header || !bar) return;
    document.documentElement.style.setProperty(
      '--chrome-h', (header.offsetHeight + bar.offsetHeight) + 'px'
    );
  }
  window.addEventListener('resize', syncChromeHeight);

  function loadTab() {
    stopNewOrderFlash();
    clearInterval(sectorPoll);
    sectorPoll = null;
    var isBoard = activeTab === 'bar_cozinha' || activeTab === 'tabacaria';
    document.body.classList.toggle('board-mode', isBoard);
    if (isBoard) syncChromeHeight();

    if (activeTab === 'funcionarios') loadFuncionarios();
    else if (activeTab === 'clientes') loadClientes();
    else if (activeTab === 'estoque') loadEstoque();
    else if (activeTab === 'financeiro') loadFinanceiro();
    else if (activeTab === 'bar_cozinha') loadSector('bar_cozinha', 'Bar/Cozinha');
    else if (activeTab === 'tabacaria') loadSector('tabacaria', 'Tabacaria');
    else loadComandas();
  }

  // --------------------------------------------------- alerta de pedido novo
  // Some do quadro pro áudio conseguir tocar: navegador só libera som depois
  // de um gesto do usuário, então o contexto é criado (ou reativado) no
  // primeiro clique/tecla da sessão, bem antes de qualquer pedido chegar.
  function unlockAudio() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);

  // Mudo é global e persiste (localStorage), não por setor — quem desligou
  // o som no Bar/Cozinha não quer que ele volte sozinho ao trocar de tela.
  // A animação continua mesmo mudo: só o som some.
  function isSoundMuted() {
    try { return localStorage.getItem('pdv_muted') === '1'; } catch (e) { return false; }
  }
  function setSoundMuted(v) {
    try { localStorage.setItem('pdv_muted', v ? '1' : '0'); } catch (e) {}
  }

  function playNewOrderChime() {
    if (!audioCtx || isSoundMuted()) return;
    var now = audioCtx.currentTime;
    [880, 1175].forEach(function (freq, i) {
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      var t0 = now + i * 0.15;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.4, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.32);
    });
  }

  function formatBirthDate(iso) {
    if (!iso) return '';
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  // Quantos dias faltam pro próximo aniversário, ignorando o ano de
  // nascimento — se já passou este ano, olha pro ano que vem.
  function daysUntilBirthday(birthDate) {
    var parts = (birthDate || '').split('-');
    if (parts.length !== 3) return null;
    var month = Number(parts[1]) - 1, day = Number(parts[2]);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var next = new Date(today.getFullYear(), month, day);
    if (next < today) next = new Date(today.getFullYear() + 1, month, day);
    return Math.round((next - today) / 86400000);
  }

  var AVATAR_ACCENTS = ['--gold', '--teal', '--novo', '--aguardando', '--orange', '--pink', '--ok'];
  function avatarAccent(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_ACCENTS[h % AVATAR_ACCENTS.length];
  }
  function initials(name) {
    var parts = (name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    var first = parts[0][0];
    var last = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (first + last).toUpperCase();
  }

  /* =============================== FINANCEIRO =============================== */
  // Não é contabilidade, é controle de vencimento — boletos e despesas fixas.

  function parseMoneyToCents(raw) {
    var str = (raw || '').trim();
    if (!str) return NaN;
    // "," é decimal em pt-BR; se aparece, "." vira separador de milhar e some.
    str = str.indexOf(',') !== -1 ? str.replace(/\./g, '').replace(',', '.') : str;
    var n = parseFloat(str);
    return isFinite(n) ? Math.round(n * 100) : NaN;
  }

  function isOverdue(e) {
    if (e.paid_at || !e.due_date) return false;
    var today = new Date();
    var iso = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    return e.due_date < iso;
  }

  function fetchExpenses(status, list, summary) {
    list.innerHTML = '<p class="empty-msg">Carregando…</p>';
    if (summary) summary.classList.add('hidden');
    api('/api/pdv/expenses?status=' + encodeURIComponent(status)).then(function (data) {
      list.innerHTML = '';
      if (!data.expenses.length) {
        list.appendChild(emptyState('wallet', 'Nenhuma despesa aqui.'));
        return;
      }
      if (summary) {
        var totalCents = data.expenses.reduce(function (s, e) { return s + e.amount_cents; }, 0);
        var overdueCount = data.expenses.filter(isOverdue).length;
        summary.innerHTML = '';
        summary.appendChild(statChip(String(data.expenses.length), data.expenses.length === 1 ? 'despesa' : 'despesas'));
        summary.appendChild(statChip(formatCents(totalCents), 'soma'));
        if (overdueCount) summary.appendChild(statChip(String(overdueCount), 'atrasada', true));
        summary.classList.remove('hidden');
      }
      data.expenses.forEach(function (e) { list.appendChild(expenseCard(e, function () { fetchExpenses(status, list, summary); })); });
    }).catch(function (err) {
      list.innerHTML = '';
      list.appendChild(el('p', 'empty-msg', 'Erro ao carregar: ' + esc(err.message)));
    });
  }

    if (e.recurring) metaBits.push('<span class="meta-bit">' + icon('repeat') + 'recorrente</span>');

    var actions = el('div', 'actions');

            recurring: !!e.recurring, category: e.category, paid: true,

        }).then(function () { showToast('Marcada como paga'); onChanged(); })
          .catch(function (err) { showToast(err.message, true); payBtn.disabled = false; });
      });

    var editBtn = el('button', '', icon('edit') + ' Editar');

    var dueInput = el('input'); dueInput.type = 'date'; dueInput.className = 'small-input'; dueInput.value = e.due_date || '';
    var catInput = el('input'); catInput.className = 'small-input'; catInput.value = e.category || '';
    catInput.placeholder = 'Categoria (opcional)';
    var recLabel = el('label', 'check');
    var recCheck = el('input'); recCheck.type = 'checkbox'; recCheck.checked = !!e.recurring;
    recLabel.appendChild(recCheck); recLabel.appendChild(document.createTextNode('Recorrente'));
    var paidLabel = el('label', 'check');
    var paidCheck = el('input'); paidCheck.type = 'checkbox'; paidCheck.checked = !!e.paid_at;
    paidLabel.appendChild(paidCheck); paidLabel.appendChild(document.createTextNode('Paga'));

    grid.appendChild(descInput);
    grid.appendChild(amountInput);
    grid.appendChild(dueInput);
    grid.appendChild(catInput);
    grid.appendChild(recLabel);
    grid.appendChild(paidLabel);
    form.appendChild(grid);

    var saveRow = el('div', 'save-row');
    var saveBtn = el('button', 'save', 'Salvar');
    var cancelBtn = el('button', 'cancel', 'Cancelar');
    saveRow.appendChild(saveBtn);
    saveRow.appendChild(cancelBtn);
    form.appendChild(saveRow);
    card.appendChild(form);

    editBtn.addEventListener('click', function () { form.classList.toggle('open'); });
    cancelBtn.addEventListener('click', function () { form.classList.remove('open'); });

    saveBtn.addEventListener('click', function () {
      var description = descInput.value.trim();
      var amountCents = parseMoneyToCents(amountInput.value);
      if (!description) { showToast('Informe a descrição', true); return; }
      if (!isFinite(amountCents) || amountCents <= 0) { showToast('Valor inválido', true); return; }
      var payload = {
        description: description, amountCents: amountCents, dueDate: dueInput.value || null,
        category: catInput.value.trim(), recurring: recCheck.checked, paid: paidCheck.checked,
      };
      saveBtn.disabled = true;
      api('/api/pdv/expenses/' + e.id, { method: 'PUT', body: JSON.stringify(payload) })
        .then(function () { showToast('Salvo'); onChanged(); })
        .catch(function (err) { showToast(err.message, true); })
        .finally(function () { saveBtn.disabled = false; });

  /* =============================== CATÁLOGO =============================== */

  function loadCatalog() {
    if (catalogCache) return Promise.resolve(catalogCache);
    return api('/api/pdv/catalog').then(function (data) {
      catalogCache = data.sections.flatMap(function (s) {
        return s.groups.flatMap(function (g) {
          return g.items.map(function (it) {
            return { id: it.id, name: it.name, unit: it.unit, priceCents: it.priceCents,
                     sector: g.sector, groupTitle: g.title, sectionTitle: s.title };
          });
        });
      });
      return catalogCache;
    });
  }

  function formatCents(cents) {
    return 'R$' + (cents / 100).toFixed(2).replace('.', ',');
  }

  /* ============================== COMANDAS ================================= */

  // Ajuste isto se o salão tiver outro número de mesas — não precisa de
  // migração nova, é só a grade que muda de tamanho.
  var TABLE_COUNT = 12;
  var MESA_STATUS_LABEL = { livre: 'Livre', ocupada: 'Ocupada', aguardando: 'Aguardando' };

  function loadComandas() {
    content.innerHTML = '';
    currentBack = goHome;
    var head = el('div', 'panel-head');
    head.appendChild(el('h2', '', icon('ticket') + 'Comandas'));
    content.appendChild(head);

    var grid = el('div', 'mesa-grid');
    grid.innerHTML = '<p class="empty-msg">Carregando…</p>';
    content.appendChild(grid);

    content.appendChild(sectionHead('user', 'Balcão / Avulso'));
    var balcaoList = el('div');
    balcaoList.innerHTML = '<p class="empty-msg">Carregando…</p>';
    content.appendChild(balcaoList);
    content.appendChild(addTabBlock(refresh));

    function refresh() {
      api('/api/pdv/tabs?status=aberta').then(function (data) {
        var byTable = {};
        var avulsas = [];
        data.tabs.forEach(function (t) {
          if (t.table_number) byTable[t.table_number] = t; else avulsas.push(t);
        });

        grid.innerHTML = '';
        for (var n = 1; n <= TABLE_COUNT; n++) grid.appendChild(mesaTile(n, byTable[n] || null));

        balcaoList.innerHTML = '';
        if (!avulsas.length) balcaoList.appendChild(emptyState('user', 'Nenhuma comanda avulsa aberta.'));
        else avulsas.forEach(function (t) { balcaoList.appendChild(tabListCard(t)); });
      }).catch(function (err) {
        grid.innerHTML = '';
        grid.appendChild(el('p', 'empty-msg', 'Erro ao carregar: ' + esc(err.message)));
      });
    }

    refresh();
    // O salão não fica olhando pra tela esperando: atualiza sozinho, igual
    // ao quadro de setor.
    sectorPoll = setInterval(refresh, 6000);
  }

  // livre = sem comanda aberta nessa mesa. ocupada = tem comanda com item
  // ainda não entregue (serviço em andamento). aguardando = tudo já foi
  // entregue, só falta fechar a conta — é o sinal de "vai lá".
  function mesaTile(n, tab) {
    var state = !tab ? 'livre' : (tab.allDelivered ? 'aguardando' : 'ocupada');
    var tile = el('button', 'mesa-tile ' + state);
    tile.type = 'button';
    tile.appendChild(el('span', 'mesa-number mono', String(n).padStart(2, '0')));
    tile.appendChild(el('span', 'mesa-status', MESA_STATUS_LABEL[state]));
    if (tab) {
      var amount = tab.pendingCents > 0 ? tab.pendingCents : tab.totalCents;
      tile.appendChild(el('span', 'mesa-total mono', formatCents(amount)));
    }
    tile.addEventListener('click', function () {
      if (tab) { loadTabDetail(tab.id); return; }
      tile.disabled = true;
      api('/api/pdv/tabs', { method: 'POST', body: JSON.stringify({ tableNumber: n }) })
        .then(function (res) { loadTabDetail(res.id); })
        .catch(function (err) { showToast(err.message, true); tile.disabled = false; });
    });
    return tile;
  }

  function tabListCard(t) {
    var card = el('div', 'row-card clickable');
    var head = el('div', 'head');
    var left = el('div', 'tab-card-left');
    left.appendChild(el('span', 'row-icon', icon('ticket')));
    var nameBlock = el('div');

    nameBlock.appendChild(el('div', 'name', esc(t.label)));
    var metaHtml = (t.customer_name ? esc(t.customer_name) : 'Sem cliente vinculado') +
      '<span class="dot-sep">&middot;</span>aberta há ' + fmtElapsed(elapsedMinutes(t.opened_at));
    nameBlock.appendChild(el('div', 'meta', metaHtml));
    left.appendChild(nameBlock);
    head.appendChild(left);
    head.appendChild(el('div', 'badge amount mono', formatCents(t.totalCents)));
    card.appendChild(head);
    card.addEventListener('click', function () { loadTabDetail(t.id); });
    return card;
  }

  function addTabBlock(onAdded) {
    var wrap = el('div', 'add-block');
    var toggleBtn = el('button', '', icon('plus') + ' Abrir comanda avulsa');
    var box = el('div', 'add-form-box');
    var grid = el('div', 'grid');
    var labelInput = el('input'); labelInput.className = 'name-input';
    labelInput.placeholder = 'Nome da comanda (cliente, viagem...)';
    grid.appendChild(labelInput);
    box.appendChild(grid);
    var confirmBtn = el('button', 'btn', 'Abrir');
    box.appendChild(confirmBtn);

    toggleBtn.addEventListener('click', function () { box.classList.toggle('open'); });
    confirmBtn.addEventListener('click', function () {
      var label = labelInput.value.trim();
      if (!label) { showToast('Dê um nome pra comanda', true); return; }
      confirmBtn.disabled = true;
      api('/api/pdv/tabs', { method: 'POST', body: JSON.stringify({ label: label }) })
        .then(function (res) { loadTabDetail(res.id); })
        .catch(function (err) { showToast(err.message, true); })
        .finally(function () { confirmBtn.disabled = false; });
    });

    wrap.appendChild(toggleBtn);
    wrap.appendChild(box);
    return wrap;
