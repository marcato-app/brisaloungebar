<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brisa Lounge Bar</title>
<meta name="description" content="Onde a brisa é leve e a experiência é única. Bar &amp; Lounge no Riacho Grande, São Bernardo do Campo.">
<meta property="og:title" content="Brisa Lounge Bar">
<meta property="og:description" content="Onde a brisa é leve e a experiência é única.">
<meta property="og:image" content="assets/img/hero-bucket.jpg">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<style>
  @font-face {
    font-family: 'Cinzel';
    src: url('assets/fonts/cinzel.woff2') format('woff2');
    font-weight: 400 600;
    font-display: swap;
  }
  @font-face {
    font-family: 'Jost';
    src: url('assets/fonts/jost.woff2') format('woff2');
    font-weight: 300 600;
    font-display: swap;
  }

  :root {
    --ink: #0c0a09;
    --gold: #e2aa18;
    --gold-soft: #f0c65a;
    --text: #f4eee4;
    --text-dim: #9c9086;
    --hairline: rgba(226, 170, 24, 0.16);
    --glass: rgba(255, 255, 255, 0.035);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--ink);
    color: var(--text);
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* Atmospheric backdrop */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .backdrop img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 42%;
    filter: saturate(0.85) brightness(0.78);
  }
  .backdrop::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(120% 80% at 50% 8%, rgba(12,10,9,0.05) 0%, rgba(12,10,9,0.55) 48%, rgba(12,10,9,0.93) 82%),
      linear-gradient(180deg, rgba(12,10,9,0.30) 0%, rgba(12,10,9,0.62) 48%, var(--ink) 96%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    flex: 1 0 auto;
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 52px 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Brand lockup */
  .lockup {
    text-align: center;
    margin-bottom: 46px;
  }
  .lockup img {
    width: 76px;
    height: auto;
    margin: 0 auto 20px;
    display: block;
  }
  .wordmark {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 600;
    font-size: 2.15rem;
    line-height: 1;
    letter-spacing: 0.1em;
    margin: 0;
    color: var(--text);
  }
  .sub-mark {
    margin: 11px 0 0;
    font-size: 0.62rem;
    font-weight: 400;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .rule {
    width: 34px;
    height: 1px;
    background: var(--gold);
    opacity: 0.5;
    margin: 22px auto;
    border: 0;
  }
  .tagline {
    margin: 0;
    font-size: 1rem;
    line-height: 1.55;
    color: var(--text-dim);
    letter-spacing: 0.015em;
  }

  /* Links */
  nav {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 21px 20px;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid rgba(255, 255, 255, 0.07);
    color: var(--text);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.15s ease;
  }
  .card:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: var(--hairline);
  }
  .card:active { transform: scale(0.985); }
  .card:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  /* Primary card gets a warmer presence, same family */
  .card.primary {
    background: linear-gradient(180deg, rgba(226,170,24,0.10) 0%, rgba(226,170,24,0.04) 100%);
    border-color: rgba(226, 170, 24, 0.34);
  }
  .card.primary:hover { border-color: rgba(226, 170, 24, 0.6); }

  .card .icon {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    color: var(--gold);
  }
  .card .icon svg { display: block; width: 100%; height: 100%; }

  .card .body { flex: 1 1 auto; min-width: 0; }
  .card .label {
    display: block;
    font-size: 1.12rem;
    font-weight: 500;
    letter-spacing: 0.028em;
    line-height: 1.25;
  }
  .card .meta {
    display: block;
    margin-top: 5px;
    font-size: 0.87rem;
    font-weight: 300;
    line-height: 1.45;
    color: var(--text-dim);
    letter-spacing: 0.012em;
  }
  .card .chev {
    flex: 0 0 auto;
    width: 17px;
    height: 17px;
    color: var(--gold);
    opacity: 0.55;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .card:hover .chev { opacity: 1; transform: translateX(2px); }
  .card .chev svg { display: block; width: 100%; height: 100%; }

  /* Map card: preview on top, address row below, whole card tappable */
  .card.with-map {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 0;
    overflow: hidden;
  }
  .map-frame {
    position: relative;
    height: 168px;
    background: #17130f;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    overflow: hidden;
  }
  /* Shown until the map reports it loaded — and left in place if it never
     does, so a blocked or failed embed still looks designed. */
  .map-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    color: var(--text-dim);
    background:
      radial-gradient(120% 90% at 50% 40%, rgba(226,170,24,0.07) 0%, transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.028) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.028) 0 1px, transparent 1px 34px);
  }
  .map-fallback svg { width: 26px; height: 26px; color: var(--gold); }
  .map-fallback span {
    font-size: 0.78rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .map-frame iframe {
    position: relative;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    /* Google's map is light; grade it so it sits in the dark page, and
       keep it inert so tapping opens the Maps app instead of panning. */
    filter: invert(0.9) hue-rotate(180deg) saturate(0.55) brightness(0.95) contrast(0.92);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .map-frame iframe.is-ready { opacity: 1; }
  .map-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(12,10,9,0.18) 0%, rgba(12,10,9,0.42) 100%);
    pointer-events: none;
  }
  .card .card-inner {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
  }

  footer {
    position: relative;
    z-index: 1;
    flex: 0 0 auto;
    text-align: center;
    padding: 34px 26px 30px;
    font-size: 0.66rem;
    font-weight: 300;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6f665e;
  }

  /* Entrance */
  @media (prefers-reduced-motion: no-preference) {
    .reveal {
      opacity: 0;
      transform: translateY(12px);
      animation: rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .lockup.reveal { animation-delay: 0.05s; }
    nav .reveal:nth-child(1) { animation-delay: 0.20s; }
    nav .reveal:nth-child(2) { animation-delay: 0.29s; }
    nav .reveal:nth-child(3) { animation-delay: 0.38s; }
    nav .reveal:nth-child(4) { animation-delay: 0.47s; }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
  }

  @media (min-width: 480px) {
    .wrap { padding-top: 80px; }
    .wordmark { font-size: 2.4rem; }
  }
</style>
</head>
<body>

<div class="backdrop"><img src="assets/img/venue-night.jpg" alt=""></div>

<div class="wrap">

  <header class="lockup reveal">
    <img src="assets/img/logo.png" alt="">
    <h1 class="wordmark">BRISA</h1>
    <p class="sub-mark">Lounge Bar</p>
    <hr class="rule">
    <p class="tagline">Onde a brisa é leve<br>e a experiência é única</p>
  </header>

  <nav>
    <a class="card primary reveal" id="menuLink" href="/cardapio">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="2.75" width="15" height="18.5" rx="2"/>
          <path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>
        </svg>
      </span>
      <span class="body">
        <span class="label">Cardápio</span>
        <span class="meta">Drinks, porções, tábuas e caldos</span>
      </span>
      <span class="chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </span>
    </a>

    <a class="card with-map reveal" href="https://www.google.com/maps/search/?api=1&amp;query=Rua+Rio+Acima%2C+455+-+Riacho+Grande+-+S%C3%A3o+Bernardo+do+Campo" target="_blank" rel="noopener">
      <span class="map-frame">
        <span class="map-fallback" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10.5c0 5.4-8 12-8 12s-8-6.6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10.2" r="2.9"/>
          </svg>
          <span>Ver no mapa</span>
        </span>
        <iframe id="mapFrame"
          src="https://maps.google.com/maps?q=Rua%20Rio%20Acima%2C%20455%2C%20Riacho%20Grande%2C%20S%C3%A3o%20Bernardo%20do%20Campo&amp;z=16&amp;output=embed"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          title="Mapa da localização do Brisa Lounge Bar"
          tabindex="-1"
          aria-hidden="true"></iframe>
      </span>
      <span class="card-inner">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10.5c0 5.4-8 12-8 12s-8-6.6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10.2" r="2.9"/>
          </svg>
        </span>
        <span class="body">
          <span class="label">Como chegar</span>
          <span class="meta">Rua Rio Acima, 455 — Riacho Grande<br>São Bernardo do Campo</span>
        </span>
        <span class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </span>
      </span>
    </a>

    <a class="card reveal" href="https://maps.app.goo.gl/Yk5DbTYMyao2SHWq5?g_st=ic" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3.5l2.55 5.4 5.95.75-4.4 4.1 1.2 5.9L12 16.9l-5.3 2.75 1.2-5.9-4.4-4.1 5.95-.75Z" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="body">
        <span class="label">Avaliar no Google</span>
        <span class="meta">Deixe sua nota e um comentário</span>
      </span>
      <span class="chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </span>
    </a>

    <a class="card reveal" href="https://instagram.com/brisaloungebar" target="_blank" rel="noopener">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="body">
        <span class="label">Instagram</span>
        <span class="meta">@brisaloungebar</span>
      </span>
      <span class="chev" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </span>
    </a>
  </nav>

</div>

<footer>Brisa Lounge Bar</footer>

<script>
  // Reveal the map only once it actually loads; if it never does, the
  // designed placeholder behind it simply stays put.
  (function () {
    var f = document.getElementById('mapFrame');
    if (!f) return;
    f.addEventListener('load', function () { f.classList.add('is-ready'); });
  })();
</script>

</body>
</html>
